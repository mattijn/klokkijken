<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="engine" content="server">
<title>IJsbaan-klok</title>
<meta name="description" content="Een schaatsspel om klokkijken te oefenen. Tik het uur, draai de grote wijzer en laat de ijsbaan uit elkaar spatten.">
<meta property="og:type" content="website">
<meta property="og:title" content="IJsbaan-klok">
<meta property="og:description" content="Een schaatsspel om klokkijken te oefenen. Tik het uur, draai de grote wijzer en laat de ijsbaan uit elkaar spatten.">
<meta property="og:url" content="https://mattijn.github.io/klokkijken/">
<meta property="og:image" content="https://mattijn.github.io/klokkijken/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Syne:wght@400;600;700;800&display=swap">
<style>
:root{
  --night:#160A36; --night-2:#1F0F4D; --ink:#FFFFFF; --lilac:#CDBBFF; --mute:#9C8CD6;
  --pink:#FF4FB3; --cyan:#3EE8FF; --gold:#FFD34E; --line:rgba(205,187,255,.22);
  --f-neon:"Monoton","Arial Black",sans-serif; --f-main:"Syne","Avenir Next",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font:400 17px/1.4 var(--f-main);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:max(12px,env(safe-area-inset-top)) 18px 0;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.hud .left,.hud .right{display:flex;align-items:center;gap:10px;min-width:0}
.score{font:400 clamp(26px,4vw,40px)/1 var(--f-neon);color:var(--cyan);text-shadow:0 0 14px rgba(62,232,255,.7);font-variant-numeric:tabular-nums}
.combo{font:800 22px/1 var(--f-main);color:var(--pink);text-shadow:0 0 12px rgba(255,79,179,.6);min-width:3ch}
.combo.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);transition:all .2s}
.dot.frozen{border-radius:3px;transform:rotate(45deg) scale(.9)}
.dot.build{border-radius:3px;border-color:rgba(255,211,78,.55)}
.dot.now{border-color:var(--pink);box-shadow:0 0 10px rgba(255,79,179,.6)}
.dot.done{background:var(--cyan);border-color:var(--cyan)}
.chip{all:unset;cursor:pointer;font:700 13px/1 var(--f-main);color:var(--lilac);border:1.5px solid var(--line);border-radius:999px;padding:9px 13px;white-space:nowrap}
.chip[aria-pressed="false"]{opacity:.55}
.hud .chip{display:inline-flex;align-items:center;gap:6px}
.level{font:700 13px/1 var(--f-main);letter-spacing:.14em;text-transform:uppercase;color:var(--lilac);white-space:nowrap}

.target{position:fixed;left:0;right:0;top:64px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;z-index:4;padding:0 16px}
.target .lbl,.live .lbl{font:700 12px/1 var(--f-main);letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
.blocks{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.word{font:800 clamp(22px,3.8vw,40px)/1 var(--f-main);padding:12px 16px 13px;border-radius:16px;border:2.5px solid;background:rgba(10,4,30,.6);
  color:var(--c);border-color:var(--c);--c:#fff;transition:background .15s,box-shadow .15s}
.word.number{--c:#FFFFFF}.word.to-hour{--c:var(--cyan)}.word.to-half,.word.half{--c:var(--pink)}.word.hour{--c:var(--gold)}
.target .word.hit{background:color-mix(in srgb,var(--c) 24%,rgba(10,4,30,.6));box-shadow:0 0 26px color-mix(in srgb,var(--c) 70%,transparent)}
.word.pop{animation:pop .32s cubic-bezier(.2,1.6,.4,1)}
.blocks.enter .word{animation:drop .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*70ms)}
.blocks.leave .word,.digital.leave{animation:leave .3s ease-in both}
.digital{font:400 clamp(46px,8vw,84px)/1 var(--f-neon);color:var(--cyan);text-shadow:0 0 .12em rgba(62,232,255,.75);font-variant-numeric:tabular-nums}
.frozen-lbl{font:800 clamp(28px,4.4vw,44px)/1 var(--f-main);color:#DFF7FF;text-shadow:0 0 20px rgba(160,230,255,.9)}

.live{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:4;padding:0 16px}
.live .blocks{flex-wrap:nowrap;gap:clamp(5px,1.5vw,10px)}
.live .word{font-size:clamp(11px,3.4vw,24px);padding:.35em .5em .4em;border-width:2px;border-radius:.6em;opacity:.92;white-space:nowrap}
.live .lbl{color:var(--mute)}
.live.spot .lbl{color:var(--gold);font-size:15px}
.live.spot .blocks{animation:spot 1s ease-in-out infinite}
@keyframes spot{50%{transform:scale(1.08);filter:drop-shadow(0 0 12px rgba(255,211,78,.8))}}
.live .nudge{font:700 clamp(15px,2vw,19px)/1.3 var(--f-main);color:var(--gold);text-align:center;max-width:46ch}
.live .samen{pointer-events:auto;font-size:17px;padding:11px 18px;border-radius:999px}
.panel .ghost-line{opacity:.45;margin:0 0 6px}

.panel{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(660px,calc(100% - 28px));z-index:6;
  background:rgba(22,10,54,.94);border:1.5px solid rgba(160,230,255,.55);border-radius:26px;padding:22px;box-shadow:0 0 50px rgba(120,210,255,.18);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.panel[hidden]{display:none}
.panel.wobble{animation:wobble .4s}
.panel .ask{font:800 clamp(21px,3vw,27px)/1.3 var(--f-main);margin:0 0 6px}
.panel .sub{color:var(--lilac);margin:0 0 14px}
.panel .blocks{justify-content:flex-start;margin:10px 0 16px}
.panel .blocks .word{font-size:clamp(18px,2.6vw,26px);padding:9px 13px 10px}
.panel form{display:flex;gap:10px;flex-wrap:wrap}
.panel input{flex:1 1 260px;min-width:0;font:800 clamp(22px,3vw,28px)/1.2 var(--f-main);padding:15px 18px;border-radius:16px;border:2px solid var(--line);
  background:#0D0626;color:#fff;outline:none;-webkit-user-select:text;user-select:text}
.panel input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(62,232,255,.15)}
.choices{display:flex;flex-wrap:wrap;gap:12px}
.btn{all:unset;cursor:pointer;font:800 clamp(19px,2.6vw,23px)/1 var(--f-main);padding:17px 24px;border-radius:18px;background:var(--night-2);border:2px solid var(--line);color:#fff;
  transition:transform .12s,border-color .12s;text-align:center}
.btn:hover{border-color:var(--cyan);transform:translateY(-2px)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.btn.primary{background:var(--pink);border-color:var(--pink);color:var(--night)}
.btn.ghost{background:transparent}
.hint{margin:14px 0 0;color:var(--gold);font-weight:700;min-height:1.4em}
.thinking{display:flex;align-items:center;gap:12px;font:800 22px var(--f-main);color:#DFF7FF;padding:8px 0}
.thinking i{width:12px;height:12px;border-radius:50%;background:var(--cyan);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
.built{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:62px;margin:6px 0 18px}
.built .slot{width:64px;height:52px;border-radius:16px;border:2.5px dashed var(--line);animation:blink 1.4s infinite}
.tray{display:flex;flex-wrap:wrap;gap:10px}
.tray .word{all:unset;cursor:pointer;font:800 clamp(18px,2.6vw,26px)/1 var(--f-main);padding:10px 16px;border-radius:16px;border:2.5px solid var(--line);color:#fff;background:var(--night-2)}
.tile,.tray .word{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:64px;min-height:52px}
.tile small,.tray .word small{font:700 13px/1 var(--f-main);letter-spacing:.02em;opacity:.85}
.tray .word:hover{border-color:var(--cyan)}
.tray .word[hidden]{display:none}
.built .back{padding:11px 14px;display:inline-flex;color:var(--lilac)}
.tray .word.nope{animation:wobble-x .35s}
@keyframes wobble-x{25%{transform:translateX(-8px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.steps{display:flex;gap:6px}.steps b{width:26px;height:6px;border-radius:3px;background:var(--line)}.steps b.on{background:var(--cyan)}

.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;background:rgba(22,10,54,.72);padding:24px;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.overlay[hidden]{display:none}
.overlay.crash{z-index:20}
#parents{z-index:9}
.sub-title{font:800 clamp(26px,4vw,36px)/1.1 var(--f-main);margin:0;color:#fff}
.card.wide{max-width:760px;width:100%}
.card code{font:13px/1.4 ui-monospace,monospace;color:var(--mute);max-width:60ch;overflow-wrap:anywhere}
.report{width:100%;border-collapse:collapse;text-align:left;font-size:16px}
.report th,.report td{padding:9px 10px;border-bottom:1px solid var(--line)}
.report th{color:var(--mute);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.report .n{text-align:right;font-variant-numeric:tabular-nums}
.report .up{color:var(--pink)}.report .down{color:var(--cyan)}
.focus{text-align:left;display:grid;gap:10px;width:100%}
.focus h3{font:800 20px/1.2 var(--f-main);margin:14px 0 0;color:var(--gold)}
.card .focus p{max-width:none;font-size:18px;color:#fff}
.progress{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.progress li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:18px}
.progress .ok{color:var(--cyan)}.progress .almost{color:var(--gold)}.progress .hard{color:var(--pink)}.progress .none{color:var(--mute)}
.said{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:20px;font-weight:700}
.said .no{color:var(--pink)}.said .yes{color:var(--cyan)}
.card p.small{font-size:13px;color:var(--mute)}
.players{display:grid;gap:10px;justify-items:center}
.players .lbl{font:700 12px/1 var(--f-main);letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
#add-player{padding:6px 6px 6px 14px}
#add-player input{all:unset;width:9em;font:700 16px var(--f-main);color:#fff;-webkit-user-select:text;user-select:text}
#add-player button{all:unset;cursor:pointer;font:800 20px/1 var(--f-main);color:var(--gold);padding:4px 10px}
.btn[hidden]{display:none}
.card{text-align:center;max-width:720px;display:grid;gap:18px;justify-items:center}
.title{font:400 clamp(46px,10vw,118px)/1 var(--f-neon);color:var(--pink);text-shadow:0 0 .1em rgba(255,79,179,.8),0 0 .4em rgba(255,79,179,.35);margin:0}
.card p{margin:0;color:var(--lilac);font-size:clamp(17px,2.2vw,21px);max-width:46ch}
.levels{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.lv{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);font:700 16px var(--f-main);color:var(--lilac)}
.lv b{font:400 20px/1 var(--f-neon);color:var(--gold)}
.lv[aria-pressed="true"]{border-color:var(--pink);color:#fff;box-shadow:0 0 22px rgba(255,79,179,.35)}
.lv:disabled{opacity:.35;cursor:not-allowed}
.trail{position:relative;width:min(640px,100%);height:240px}
.trail canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.trail .lv{position:absolute;transform:translate(-50%,-22px);flex-direction:column;gap:3px;padding:0;border:0;width:84px;text-align:center;font:700 13px/1.15 var(--f-main)}
.trail .lv b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:3px solid var(--c);background:var(--night-2);font-size:19px}
.trail .lv[aria-pressed="true"]{box-shadow:none}.trail .lv[aria-pressed="true"] b{border-color:var(--pink);box-shadow:0 0 18px rgba(255,79,179,.6)}
.trail .lv i{font-style:normal;color:var(--gold);letter-spacing:.08em}.trail .lv i em{font-style:normal;color:rgba(205,187,255,.25)}
.trail .cup{all:unset;position:absolute;transform:translate(-50%,-80%);width:52px;height:56px;cursor:pointer}.trail .cup:disabled{cursor:default}
.rule{font-size:14px!important;color:var(--mute)!important}
.gates{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.gates span{display:grid;place-items:center;gap:2px;min-width:52px;padding:8px 6px;border-radius:14px;border:2.5px solid var(--line);font:800 26px/1 var(--f-main)}
.gates .yes{color:var(--cyan);border-color:rgba(62,232,255,.5)}.gates .no{color:var(--pink);border-color:rgba(255,79,179,.5)}
.gates small{font:700 12px/1 var(--f-main);color:var(--lilac)}
#goal{font:800 clamp(18px,2.4vw,22px)/1.3 var(--f-main);color:#fff}
@media (max-width:480px){.trail .lv{width:64px;font-size:11px}.trail .lv b{width:38px;height:38px;font-size:16px}}
.stars{font-size:clamp(48px,9vw,84px);letter-spacing:.1em;line-height:1}
.stars span{color:rgba(205,187,255,.2)}.stars span.on{color:var(--gold);text-shadow:0 0 24px rgba(255,211,78,.8)}
.stats{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.stats div{display:grid;gap:4px}.stats b{font:400 clamp(30px,5vw,48px)/1 var(--f-neon);color:var(--cyan)}.stats span{color:var(--mute);font-size:14px}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes drop{from{transform:translateY(-34px) scale(.6);opacity:0}}
@keyframes leave{to{transform:scale(1.35);opacity:0;filter:blur(3px)}}
@keyframes wobble{20%{transform:translateX(calc(-50% - 10px))}40%{transform:translateX(calc(-50% + 8px))}60%{transform:translateX(calc(-50% - 5px))}80%{transform:translateX(calc(-50% + 3px))}}
@keyframes blink{50%{opacity:.25;transform:scale(.7)}}
body.calm *{animation:none!important;transition:none!important}
@media (max-width:640px){.hud .level{display:none}.dot{width:10px;height:10px}.dots{gap:5px}}
@media (max-width:480px){
  .hud .chip span{display:none}
  .hud{gap:8px;padding-left:12px;padding-right:12px}.hud .right{gap:6px}.chip{padding:7px 9px;font-size:12px}.dot{width:8px;height:8px}.dots{gap:4px}
  .panel{padding:14px 16px;border-radius:20px}.panel .ask{font-size:18px}
  .built{min-height:46px;margin:4px 0 10px;gap:8px}.built .slot{width:52px;height:44px}
  .tray{gap:8px}.tray .word{font-size:17px;padding:7px 12px;min-width:50px;min-height:44px}.tile{min-width:50px;min-height:44px}
}
</style>
</head>
<body>
<canvas id="stage" aria-label="IJsbaan-klok: sleep de grote wijzer"></canvas>

<div class="hud">
  <div class="left"><span class="score" id="score">0</span><span class="combo" id="combo"></span></div>
  <div class="dots" id="dots" aria-label="Poorten"></div>
  <div class="right"><span class="level" id="level"></span>
    <button class="chip" id="t-menu" type="button" aria-label="Niveaus"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>Niveaus</span></button>
    <button class="chip" id="t-sound" type="button" aria-pressed="true" aria-label="Geluid"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><span>Geluid</span></button>
    <button class="chip" id="t-calm" type="button" aria-pressed="false" aria-label="Rustig"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span>Rustig</span></button></div>
</div>

<div class="target" id="target"></div>
<div class="live" id="live"></div>
<div class="panel" id="panel" hidden aria-live="polite"></div>

<div class="overlay" id="start">
  <div class="card">
    <h1 class="title">IJsbaan-klok</h1>
    <div class="players" id="players"></div>
    <div class="trail" id="levels"></div>
    <p class="rule">★★ = verder &nbsp;·&nbsp; ★★★ = alles in één keer, zonder Samen doen</p>
    <button class="btn primary" id="go" type="button">Schaatsen!</button>
    <button class="chip" id="open-parents" type="button">Voor ouders</button>
  </div>
</div>

<div class="overlay" id="parents" hidden>
  <div class="card wide">
    <h2 class="sub-title" id="parents-title">Hoe gaat het klokkijken?</h2>
    <div id="report"></div>
    <div class="choices"><button class="btn primary" id="close-parents" type="button">Terug</button>
      <button class="btn ghost" id="reset" type="button">Opnieuw beginnen</button>
      <button class="btn ghost" id="forget" type="button" hidden>Naam weghalen</button></div>
    <p class="small">Dit overzicht staat alleen op dit apparaat.</p>
  </div>
</div>

<div class="overlay crash" id="crash" hidden>
  <div class="card">
    <h2 class="sub-title">De klok is vastgelopen</h2>
    <p>Dat is een fout in het spel, niet in jouw antwoord. Laad de pagina opnieuw om verder te spelen.</p>
    <code id="crash-msg"></code>
    <button class="btn primary" id="reload" type="button">Opnieuw laden</button>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card">
    <h1 class="title" id="end-title">Klaar!</h1>
    <div class="stars" id="stars"></div>
    <div class="gates" id="gates"></div>
    <p id="goal"></p>
    <div class="stats" id="stats"></div>
    <p id="unlock"></p>
    <div class="trail" id="levels-end"></div>
    <button class="btn primary" id="again" type="button">Nog een rondje</button>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);

/* een fout legt de klok stil; laat dat zien in plaats van stil te bevriezen */
function crashed(message) { $('#crash-msg').textContent = message; $('#crash').hidden = false; }
addEventListener('error', e => crashed(e.message));
addEventListener('unhandledrejection', e => crashed(String(e.reason)));

/* ---------- spel ---------- */
const LEVELS = [
  {name: 'Hele uren', minutes: [0], step: 15},
  {name: 'Half', minutes: [0, 30], step: 15},
  {name: 'Kwartier', minutes: [0, 15, 30, 45], step: 5},
  {name: 'Rond de half', minutes: Array.from({length: 12}, (_, i) => i * 5), step: 5, loupe: true},
  {name: 'Digitaal', minutes: Array.from({length: 60}, (_, i) => i), step: 1, digital: true, loupe: true},
];
const GATES = 10, AGAIN = 2, BUILD = new Set([2, 7]), FROZEN = new Set([4, 9]), START = 18 * 60, REACH = 240, HOLD = 350, FAST = 9000;

/* op een gedeelde computer heeft elke naam eigen niveaus, voordoen en overzicht; geluid en rustig gelden voor iedereen */
const OWN = ['level', 'unlocked', 'coached', 'log', 'stars'];
const store = {
  player: '',
  key: k => 'ijsbaan.' + (store.player && OWN.includes(k) ? `${store.player}.` : '') + k,
  get(k, d) { try { const v = localStorage.getItem(store.key(k)); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(store.key(k), JSON.stringify(v)); } catch (e) { /* alleen gemak */ } },
  drop(k) { try { localStorage.removeItem(store.key(k)); } catch (e) { /* alleen gemak */ } },
};
store.player = store.get('player', '');
const S = {
  phase: 'start', level: Math.min(store.get('level', 0), LEVELS.length - 1), unlocked: Math.min(store.get('unlocked', 0), LEVELS.length - 1),
  T: START, P: START, disp: START, target: START, gate: 0, gates: GATES, again: [], score: 0, combo: 0, best: 0, firstTry: 0, coachEnd: 0, helped: false, marks: [],
  gateStart: 0, holdSince: 0, attempts: 0, sound: store.get('sound', true),

/* ---------- schaatser ---------- */
/* een hardrijder van opzij, in pak, muts en sjaal: diep gebogen bij snelheid, afzetten met het ene been terwijl het
   andere glijdt */
const SKIN = '#FFD9B8', BOOT = '#1A1030', BLADE = '#DCEBFF';
function skater(x, y, s, suit, accent, phase, speed, dir) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * dir, s); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const limb = (a, b, w, color) => { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); };
  const bend = Math.min(.35 + speed * .12, 1.05), sw = Math.sin(phase);
  const hip = [0, -18 + bend * 4];
  const leg = side => {
    const fx = 3 + side * sw * 9, lift = Math.max(0, -side * sw) * 5, foot = [fx, -2 - lift];
    const knee = [(hip[0] + fx) / 2 + 4 + bend * 3, (hip[1] + foot[1]) / 2 - 1];
    limb(hip, knee, 5.2, suit); limb(knee, foot, 4.6, suit);
    limb([fx - 2.5, foot[1]], [fx + 3.5, foot[1]], 4, BOOT);
    limb([fx - 6, foot[1] + 3], [fx + 7, foot[1] + 3], 1.6, BLADE);
  };
  const shoulder = [hip[0] + Math.sin(bend) * 15, hip[1] - Math.cos(bend) * 15];
  const up = [Math.sin(bend), -Math.cos(bend)], head = [shoulder[0] + up[0] * 7 + 1.5, shoulder[1] + up[1] * 7];
  const arm = side => [shoulder[0] - up[0] * 4 + side * 9 * Math.cos(phase), shoulder[1] + 9 - Math.abs(side * Math.sin(phase)) * 2];
  leg(-1);
  limb(shoulder, arm(-1), 3.6, suit);
  limb(hip, shoulder, 7, suit);
  leg(1);
  ctx.strokeStyle = accent; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(shoulder[0], shoulder[1] - 1);
  for (let i = 1; i <= 3; i++) ctx.lineTo(shoulder[0] - i * (3 + speed * .9), shoulder[1] - 1 + Math.sin(phase * 2 + i) * (1 + speed * .25));
  ctx.stroke();
  ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(...head, 5.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(head[0], head[1] - .8, 5.6, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
  ctx.beginPath(); ctx.arc(head[0] - 1, head[1] - 7, 2.2, 0, Math.PI * 2); ctx.fill();
  limb(shoulder, arm(1), 3.6, suit);
  ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(...arm(1), 1.9, 0, Math.PI * 2); ctx.arc(...arm(-1), 1.9, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* ---------- tekenen ---------- */
let lastT = performance.now(), speed = 0, phase = 0, hourPhase = 0, dir = 1, prevTip = null, hourHop = 0;

function frame(now) {
  const dt = Math.max(1, Math.min(50, now - lastT)); lastT = now;
  geometry(false);
  const frozenTime = now < stopUntil;
  if (!frozenTime) update(dt * (party ? party.slow : 1), now);
  draw(now); drawTrail(now, dt);
  requestAnimationFrame(frame);
}

function update(dt, now) {
  const before = S.disp;
  S.disp += (S.T - S.disp) * Math.min(1, dt / 45);
  const moved = S.disp - before;
  speed = speed * .8 + Math.abs(moved) / (dt / 16) * .2;
  if (Math.abs(moved) > .01) dir = Math.sign(moved);
  phase += Math.abs(moved) * .9; hourPhase += dt * .004;
  swoosh(S.phase === 'skate' || S.phase === 'spin' ? speed : 0);
  if (Math.floor(S.disp / 60) !== Math.floor(before / 60)) { hourHop = 1; SFX.hop(); }
  hourHop *= .9;

  const a = mod(S.disp, 60) / 60 * Math.PI * 2, tip = at(a, R * .8);
  if (prevTip && speed > .05) {
    const sx = scratchC.getContext('2d'), k = RB / R, o = RB + 20;
    sx.strokeStyle = `rgba(255,255,255,${Math.min(.35, speed * .08)})`; sx.lineWidth = 1.4;
    sx.beginPath(); sx.moveTo((prevTip[0] - CX) * k + o, (prevTip[1] - CY) * k + o); sx.lineTo((tip[0] - CX) * k + o, (tip[1] - CY) * k + o); sx.stroke();
  }
  prevTip = tip;
  const sx = scratchC.getContext('2d'); sx.save(); sx.globalCompositeOperation = 'destination-out'; sx.fillStyle = 'rgba(0,0,0,.012)'; sx.fillRect(0, 0, 2 * RB + 40, 2 * RB + 40); sx.restore();
  if (speed > .35) spray(tip[0], tip[1], Math.cos(a) * dir, Math.sin(a) * dir, Math.min(6, speed * 1.2));

  for (const p of parts) {
    p.life -= p.decay * dt / 16;
    if (p.kind === 'spray') { p.vx *= .9; p.vy *= .9; } else { p.vy += .22 * dt / 16; p.vx *= .995; p.rot += p.vr; }
    p.x += p.vx * dt / 16; p.y += p.vy * dt / 16;
  }
  parts = parts.filter(p => p.life > 0 && p.y < H + 60);
  for (const t of texts) { t.life -= .014 * dt / 16; t.y -= .7 * dt / 16; }
  texts = texts.filter(t => t.life > 0);
  for (const r of rings) { r.life -= .03 * dt / 16; r.r += 6 * dt / 16; }
  rings = rings.filter(r => r.life > 0);
  for (const f of snow) { f.y += f.v * dt / 16 * (S.calm ? .3 : 1); f.x += Math.sin(now / 1500 + f.p) * .2; if (f.y > H) { f.y = -5; f.x = Math.random() * W; } }
  frost.a += (frost.goal - frost.a) * (S.calm ? 1 : Math.min(1, dt / (frost.goal ? 250 : 120)));
  shake *= .86;

  if (S.phase === 'skate' && coach) coachStep(now);
  if (S.phase === 'skate' && !coach) {
    if (face(S.T) === face(S.target)) {
      S.holdSince = S.holdSince || now;
      if (now - S.holdSince > HOLD) passGate(now);
    } else S.holdSince = 0;
    if (mod(S.T, 60) === mod(S.target, 60) && face(S.T) !== face(S.target) && !dragging) {
      S.nudgeSince = S.nudgeSince || now;
      if (now - S.nudgeSince > 1200 && !S.nudged) nudge();
    }
    if (!S.touched && now - Math.max(S.gateStart, S.coachEnd) > 8000) startCoach(now);
    if (!S.offer && now - S.gateStart > 5000) { S.offer = true; renderLive(); }
  }
}

function draw(now) {
  ctx.clearRect(0, 0, W, H);
  const bg = ctx.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, Math.max(W, H) * .75);
  bg.addColorStop(0, '#24125A'); bg.addColorStop(1, '#160A36'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (const f of snow) { ctx.globalAlpha = f.o; ctx.beginPath(); ctx.arc(f.x, f.y, f.s, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = .45; ctx.drawImage(skyC, 0, H - skyC.height / DPR, W, skyC.height / DPR); ctx.globalAlpha = 1;

  ctx.save();
  if (shake > .3) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  ctx.save(); ctx.shadowColor = '#3EE8FF'; ctx.shadowBlur = S.calm ? 10 : 28 + 8 * Math.sin(now / 600);
  ctx.strokeStyle = '#3EE8FF'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(CX, CY, R + 6, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  const k = R / RB, o = (RB + 20) * k;
  if (blast) burstRink(now, o);
  else { ctx.drawImage(rinkC, CX - o, CY - o, 2 * o, 2 * o); ctx.drawImage(scratchC, CX - o, CY - o, 2 * o, 2 * o); }

  if (LEVELS[S.level].digital || S.phase === 'frozen') ring24();
  if (S.phase === 'skate') { hints(now); highlight(now); }

  const ha = mod(S.disp / 60, 12) / 12 * Math.PI * 2, ma = mod(S.disp, 60) / 60 * Math.PI * 2;
  const htip = at(ha, R * .5), mtip = at(ma, R * .8);
  if (!blast) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#FFD34E'; ctx.lineWidth = Math.max(6, R * .045); ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(...htip); ctx.stroke();
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = Math.max(4, R * .028); ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(...mtip); ctx.stroke();
  ctx.save(); ctx.shadowColor = '#3EE8FF'; ctx.shadowBlur = 18; ctx.fillStyle = 'rgba(62,232,255,.28)'; ctx.strokeStyle = '#3EE8FF'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(...mtip, Math.max(14, R * .075), 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(CX, CY, Math.max(6, R * .035), 0, Math.PI * 2); ctx.fill();
  const hs = R / 210 * (1 + hourHop * .5);
  skater(htip[0], htip[1] - hourHop * 14, hs * .8, '#3EE8FF', '#FF4FB3', hourPhase, .4 + Math.sin(hourPhase) * .2, Math.cos(ha) >= 0 ? 1 : -1);
  skater(mtip[0], mtip[1], R / 210 * 1.15, '#FF4FB3', '#FFD34E', phase, speed, Math.cos(ma) * dir >= 0 ? 1 : -1);
  if (bigTurn()) {
    ctx.save(); ctx.strokeStyle = '#FFD34E'; ctx.lineWidth = 3; ctx.globalAlpha = .5 + .5 * Math.sin(now / 220);
    ctx.beginPath(); ctx.arc(...mtip, Math.max(22, R * .12), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  if ((dragging === 'minute' || now - keyed < 1500) && LEVELS[S.level].loupe) loupe(ma);
  }
  if (coach) drawCoach(now);
  if (party) drawParty(now);

  for (const r of rings) { ctx.strokeStyle = `rgba(255,255,255,${r.life * .8})`; ctx.lineWidth = 4 * r.life; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke(); }
  for (const p of parts) {
    ctx.globalAlpha = Math.min(1, p.life * 1.5);
    if (p.kind === 'spray') { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
    else if (p.kind === 'shard') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = 'rgba(215,245,255,.7)'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(...p.pts[0]); ctx.lineTo(...p.pts[1]); ctx.lineTo(...p.pts[2]); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    } else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life * 2); ctx.font = `400 ${Math.round(28 + 20 * (1 - t.life))}px Monoton, sans-serif`;
    ctx.fillStyle = t.color; ctx.shadowColor = t.color; ctx.shadowBlur = 16; ctx.fillText(t.text, t.x, t.y); ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (frost.a > .01) {
    frostC = frostC || makeFrost();
    ctx.globalAlpha = frost.a; ctx.drawImage(frostC, 0, 0, W, H);
    ctx.fillStyle = 'rgba(220,248,255,.16)'; ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.strokeStyle = '#FFFFFF'; ctx.shadowColor = '#BFF3FF'; ctx.shadowBlur = 12; ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
    for (const pts of frost.cracks) { ctx.beginPath(); ctx.moveTo(...pts[0]); for (const p of pts.slice(1)) ctx.lineTo(...p); ctx.stroke(); }
    ctx.restore(); ctx.globalAlpha = 1;
  }
}

/* bij digitaal staan de uren na de middag binnenin, zoals op een schoolklok */
function ring24() {
  ctx.save(); ctx.fillStyle = 'rgba(205,187,255,.8)'; ctx.font = `700 ${Math.round(R * .075)}px Syne, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let n = 1; n <= 12; n++) ctx.fillText(n + 12, ...at(n / 12 * Math.PI * 2, R * .6));
  ctx.restore();
}

/* een goede tijd: de ijsbaan spat in taartpunten uit elkaar en valt weer samen, schoon voor de volgende tijd */
let blast = null;
function burstRink(now, o) {
  const p = Math.min(1, (now - blast.t0) / blast.dur), out = p < .5 ? ease(p / .5) : 1 - ease((p - .5) / .5);
  const far = R * (S.calm ? .12 : .9) * out, n = blast.spins.length;
  blast.spins.forEach((spin, i) => {
    const a0 = i / n * Math.PI * 2, mid = a0 + Math.PI / n;
    ctx.save(); ctx.globalAlpha = 1 - out * .4;
    ctx.translate(CX + Math.sin(mid) * far, CY - Math.cos(mid) * far); ctx.rotate(spin * out); ctx.translate(-CX, -CY);
    ctx.beginPath(); ctx.moveTo(CX, CY); ctx.arc(CX, CY, o, a0 - Math.PI / 2, a0 - Math.PI / 2 + Math.PI * 2 / n); ctx.closePath(); ctx.clip();
    ctx.drawImage(rinkC, CX - o, CY - o, 2 * o, 2 * o); ctx.restore();
  });
  if (p >= 1) blast = null;
}

/* bij het draaien van de minuten: een loep op de rand, met elk minuutstreepje genummerd */
function loupe(a) {
  const r = Math.max(60, R * .3), zoom = 1.7, rim = R * .88, [tx, ty] = at(a, rim), [lx, ly] = at(a, rim - r - Math.max(34, R * .12));
  const now = mod(S.T, 60), line = (m, from, to) => { ctx.beginPath(); ctx.moveTo(...at(m / 60 * Math.PI * 2, from)); ctx.lineTo(...at(m / 60 * Math.PI * 2, to)); ctx.stroke(); };
  ctx.save();
  ctx.beginPath(); ctx.arc(lx, ly, r, 0, Math.PI * 2); ctx.fillStyle = '#24125A'; ctx.fill(); ctx.clip();
  ctx.translate(lx, ly); ctx.scale(zoom, zoom); ctx.translate(-tx, -ty);
  ctx.lineCap = 'round'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let d = -6; d <= 6; d++) {
    const m = mod(now + d, 60), big = m % 5 === 0;
    ctx.strokeStyle = big ? '#FFFFFF' : 'rgba(205,187,255,.9)'; ctx.lineWidth = (big ? 5 : 3) / zoom; line(m, R * (big ? .87 : .9), R * .97);
    ctx.font = `800 ${r * (d ? .17 : .24) / zoom}px Syne, sans-serif`; ctx.fillStyle = d ? '#FFFFFF' : '#FFD34E';
    if (Math.abs(d) <= 3) ctx.fillText(m, ...at(m / 60 * Math.PI * 2, R * .8));
  }
  ctx.strokeStyle = '#FFD34E'; ctx.lineWidth = 3 / zoom; line(now, R * .84, R * .98);
  ctx.strokeStyle = '#3EE8FF'; ctx.lineWidth = 4 / zoom; ctx.beginPath(); ctx.arc(CX, CY, R + 6, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.strokeStyle = '#3EE8FF'; ctx.lineWidth = 3; ctx.shadowColor = '#3EE8FF'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(lx, ly, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}

function highlight(now) {
  ctx.save();
  ctx.strokeStyle = '#FFD34E'; ctx.lineWidth = 2;
  ctx.globalAlpha = S.tip ? .45 + .45 * Math.sin(now / 220) : .22;
  for (let n = 1; n <= 12; n++) { const [x, y] = at(n / 12 * Math.PI * 2, R * .74); ctx.beginPath(); ctx.arc(x, y, R * .1, 0, Math.PI * 2); ctx.stroke(); }
  if (S.point) {
    const [x, y] = at(S.point / 12 * Math.PI * 2, R * .74);
    ctx.globalAlpha = .6 + .4 * Math.sin(now / 200); ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y, R * .13, 0, Math.PI * 2); ctx.stroke();
    if (LEVELS[S.level].digital) { ctx.beginPath(); ctx.arc(...at(S.point / 12 * Math.PI * 2, R * .6), R * .065, 0, Math.PI * 2); ctx.stroke(); }
  }
  ctx.restore();
  if (!hover || dragging || hover.kind === 'small' || (hover.kind === 'hand' && !hover.n)) return;
  ctx.save();
  if (hover.n) {
    const [x, y] = at(hover.n / 12 * Math.PI * 2, R * .74);
    ctx.fillStyle = 'rgba(255,211,78,.22)'; ctx.strokeStyle = 'rgba(255,211,78,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, R * .11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = R * .11;
    ctx.beginPath(); ctx.arc(CX, CY, R * .915, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

/* voordoen: een spookhand tikt een uur aan, draait de grote wijzer en wijst naar wat de klok zegt; de klok draait echt mee */
const COACH = [
  {until: 900, label: ''},
  {until: 1500, label: 'Tik het uur'},
  {until: 2700, label: 'De kleine wijzer springt erheen'},
  {until: 3200, label: ''},
  {until: 5000, label: 'Draai de grote wijzer'},
  {until: 5600, label: ''},
  {until: 7800, label: 'Kijk: dit zegt jouw klok', below: true},
  {until: 8300, label: ''},
];
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const towards = (a, b, p) => [a[0] + (b[0] - a[0]) * ease(p), a[1] + (b[1] - a[1]) * ease(p)];

function startCoach(now) {
  coach = {t0: now, n: mod(Math.floor(S.target / 60) + 6, 12) || 12, sweep: Math.PI * .7, base: null, step: -1, labels: {}};
  store.set('coached', true);
  coachStep(now);
}

/* samen doen: de spookhand zet de echte tijd en zegt de regel erbij, daarna gaat de klok terug en doe jij het */
function startTogether(now) {
  const hour = Math.floor(mod(S.target, 1440) / 60), n = mod(hour, 12) || 12, minute = mod(S.target, 60);
  const words = PHRASES[face(S.target)].map(([w]) => w), next = mod(hour + 1, 12) || 12;
  const ahead = words.includes('half') || words.includes('voor');
  S.together = true; S.touched = true; S.tip = ''; S.combo = 0;
  coach = {t0: now, n, sweep: minute / 60 * Math.PI * 2, base: null, step: -1, back: S.T, labels: {
    1: LEVELS[S.level].digital && hour > 12 ? `${hour} = ${n}` : `Tik de ${n}`,
    2: !LEVELS[S.level].digital && ahead ? `Nog niet de ${next}` : 'De kleine wijzer springt erheen',
    6: 'Zie je? Hetzelfde!',
  }};
  renderLive(); coachStep(now);
}

function stopCoach(now) {
  const back = coach.back;
  coach = null; S.coachEnd = now; $('#live').classList.remove('spot');
  if (back !== undefined) { S.P = back; setT(false); S.tip = 'Nu jij!'; S.tapped = false; }
  renderLive();
}

function coachStep(now) {
  const t = now - coach.t0, step = COACH.findIndex(c => t < c.until);
  if (step < 0 || S.phase !== 'skate') return stopCoach(now);
  const num = at(coach.n / 12 * Math.PI * 2, R * .74), top = at(0, R * .92), sweep = coach.sweep;
  const words = $('#live .blocks').getBoundingClientRect(), live = [words.left - 34, words.top + words.height / 2];
  const from = step ? COACH[step - 1].until : 0, p = (t - from) / (COACH[step].until - from);
  if (coach.base === null && t >= 900) { setHour(coach.n); coach.base = S.T; }
  if (step === 4) { S.P = coach.base + ease(p) * sweep / (Math.PI * 2) * 60; setT(true); }
  $('#live').classList.toggle('spot', step >= 5 && step <= 6);
  coach.pos = [towards([CX, CY + R * 1.2], num, p), num, num, towards(num, top, p), at(ease(p) * sweep, R * .92),
    towards(at(sweep, R * .92), live, p), live, live][step];
  coach.label = coach.labels[step] ?? COACH[step].label; coach.fade = step === 7 ? 1 - p : 1; coach.pulse = step === 1 ? p : 0; coach.small = step === 2;
  if (step !== coach.step) {
    coach.step = step;
    if (COACH[step].below) $('#live .lbl').textContent = coach.label;
  }
}

function drawCoach(now) {
  const [x, y] = coach.pos;
  ctx.save(); ctx.globalAlpha = coach.fade;
  if (coach.pulse) { ctx.strokeStyle = `rgba(255,211,78,${1 - coach.pulse})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 14 + coach.pulse * 30, 0, Math.PI * 2); ctx.stroke(); }
  if (coach.small) {
    const [hx, hy] = at(mod(S.disp / 60, 12) / 12 * Math.PI * 2, R * .5);
    ctx.strokeStyle = '#FFD34E'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]); ctx.lineDashOffset = -now / 40;
    ctx.beginPath(); ctx.arc(hx, hy, R * .14, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  if (coach.label && !COACH[coach.step].below) {
    ctx.font = '800 20px Syne, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.shadowColor = '#160A36'; ctx.shadowBlur = 10;
    ctx.fillText(coach.label, Math.min(Math.max(x, 170), W - 170), y - 40);
  }
  ctx.restore();
}

async function nudge() {
  S.nudged = true;
  const {nudge: found} = await api('/nudge', {...clock(), at: face(S.T), digital: !!LEVELS[S.level].digital});
  if (!found || S.phase !== 'skate' || !S.nudgeSince) return;
  slip(found.mistake, 'op de klok gezet', said(S.T));
  S.point = mod(Math.floor(face(S.target) / 60), 12) || 12;
  $('#live').insertAdjacentHTML('beforeend', `<span class="nudge">${esc(found.text)}</span>`);
}

function hints(now) {
  const waited = now - S.gateStart, ta = mod(S.target, 60) / 60 * Math.PI * 2;
  if (waited > 15000) {
    ctx.save(); ctx.fillStyle = `rgba(255,211,78,${.12 + .08 * Math.sin(now / 300)})`;
    ctx.beginPath(); ctx.moveTo(CX, CY); ctx.arc(CX, CY, R * .97, ta - Math.PI / 2 - .2, ta - Math.PI / 2 + .2); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  if (waited > 30000) {
    const [gx, gy] = at(ta, R * .8);
    ctx.save(); ctx.setLineDash([6, 8]); ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(gx, gy); ctx.stroke(); ctx.restore();
  }
}

/* ---------- slepen ---------- */
let dragging = false, lastAngle = 0, hover = null, coach = null, pressed = null;
const minuteAt = e => { const a = Math.atan2(e.clientX - CX, -(e.clientY - CY)); return mod(a / (Math.PI * 2) * 60, 60); };
const wrap = d => mod(d + 30, 60) - 30;
/* de grote wijzer klikt per stap van het niveau, zodat de klok alleen tijden zegt die je op dit niveau leert */
const snap = () => LEVELS[S.level].step;

/* de getallen zijn de uren: tikken of de kleine wijzer slepen zet het uur; de grote wijzer of de rand draaien de minuten */
const hourAt = e => mod(Math.round(minuteAt(e) / 5), 12) || 12;
const grip = (e, k) => Math.max(R * k, e.pointerType === 'touch' ? 30 : 18);
const onNumber = e => { const n = hourAt(e), [x, y] = at(n / 12 * Math.PI * 2, R * .74); return Math.hypot(e.clientX - x, e.clientY - y) < grip(e, .1) ? n : 0; };

function zone(e) {
  const r = Math.hypot(e.clientX - CX, e.clientY - CY), near = ([x, y]) => Math.hypot(e.clientX - x, e.clientY - y) < grip(e, .16);
  if (S.phase !== 'skate' || r > R * 1.4) return null;
  if (r > R * .86) return {kind: 'ring'};
  if (near(at(mod(S.T, 60) / 60 * Math.PI * 2, R * .8))) return {kind: 'hand', n: onNumber(e)};
  if (near(at(mod(S.T / 60, 12) / 12 * Math.PI * 2, R * .5))) return {kind: 'small'};
  if (r > R * .58) return {kind: 'hour', n: hourAt(e)};
  return {kind: 'hand'};
}

cv.addEventListener('pointerdown', e => {
  audio();
  const z = zone(e);
  if (!z) return;
  S.touched = true; if (coach) stopCoach(performance.now());
  if (z.kind === 'hour') return tapNumber(z.n);
  /* de grote wijzer kan over een getal liggen: stil loslaten is dan een tik op dat getal, slepen draait de wijzer */
  dragging = z.kind === 'small' ? 'hour' : z.n ? 'maybe' : 'minute'; cv.setPointerCapture(e.pointerId);
  lastAngle = minuteAt(e); pressed = {x: e.clientX, y: e.clientY, n: z.n};
});
cv.addEventListener('pointermove', e => {
  if (!dragging) { hover = zone(e); cv.style.cursor = hover ? (hover.kind === 'hour' ? 'pointer' : 'grab') : ''; return; }
  if (dragging === 'maybe' && Math.hypot(e.clientX - pressed.x, e.clientY - pressed.y) > 8) dragging = 'minute';
  if (dragging === 'maybe') return;
  if (dragging === 'hour') { const n = hourAt(e); if (n !== (mod(Math.floor(S.T / 60), 12) || 12) || mod(S.T, 60)) playerHour(n); return; }
  const m = minuteAt(e); S.P += wrap(m - lastAngle); lastAngle = m; setT(true);
});
cv.addEventListener('pointerup', () => { if (dragging === 'maybe') tapNumber(pressed.n); dragging = false; });
cv.addEventListener('pointercancel', () => { dragging = false; });

/* met een toetsenbord: links en rechts draaien de grote wijzer een stap (de loep komt even in beeld), omhoog en omlaag
   zetten de kleine wijzer een uur verder of terug en laten de minuten staan */
const KEYS = {ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowUp: [0, 60], ArrowDown: [0, -60]};
let keyed = -Infinity;
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !$('#end').hidden) return $('#again').click();
  if (e.key === 'Enter' && !$('#start').hidden && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') return $('#go').click();
  if (S.phase !== 'skate' || !(e.key in KEYS)) return;
  e.preventDefault(); audio();
  S.touched = true; if (coach) stopCoach(performance.now());
  const [step, hour] = KEYS[e.key];
  if (hour) { S.usedHour = true; S.tapped = true; S.tip = ''; } else keyed = performance.now();
  S.P = S.T + step * snap() + hour; setT(true);
});

function playerHour(n) { S.usedHour = true; S.tapped = true; S.tip = ''; setHour(n); renderLive(); }

/* na een getikt uur dat klopt is de grote wijzer aan de beurt: een tik op een getal draait hem daarheen */
const bigTurn = () => S.phase === 'skate' && !coach && S.tapped
  && Math.floor(face(S.T) / 60) === Math.floor(face(S.target) / 60) && mod(S.T, 60) !== mod(S.target, 60);

function tapNumber(n) {
  if (!bigTurn()) return playerHour(n);
  S.P = Math.floor(S.T / 60) * 60 + n % 12 * 5; setT(true);
  const [x, y] = at(n / 12 * Math.PI * 2, R * .74);
  rings.push({x, y, r: 10, life: 1});
}

function setHour(n) {
  const base = n % 12 * 60;
  S.P = base + 720 * Math.round((S.T - base) / 720); setT(false);
  const [x, y] = at(n / 12 * Math.PI * 2, R * .74);
  rings.push({x, y, r: 10, life: 1}); SFX.hop();
}

function setT(dragged) {
  const step = snap(), t = Math.round(S.P / step) * step, hop = Math.floor(t / 60) - Math.floor(S.T / 60);
  if (t === S.T) return;
  if (dragged && !coach) S.spun += Math.abs(t - S.T);
  if (S.spun > 120 && !S.usedHour && !S.tip) S.tip = 'Tik op een getal';
  S.T = t; S.nudgeSince = 0; S.nudged = false; S.point = 0; SFX.tick(mod(t, 60) / step % 4); renderLive();
  if (!dragged || !hop) return;
  const h = mod(Math.floor(t / 60), 12) || 12, [x, y] = at(mod(t / 60, 12) / 12 * Math.PI * 2, R * .5);
  floatText(x, y - 34, hop < 0 ? `‹ ${h}` : `${h} ›`, '#FFD34E');
}

/* ---------- zinnen in beeld ---------- */
let hits = new Set();
function renderTarget(cls = 'enter') {
  const el = $('#target');
  if (BUILD.has(S.gate) && (S.phase === 'spin' || S.phase === 'build')) {
    el.innerHTML = `<span class="lbl">Bouw de tijd</span>${LEVELS[S.level].digital ? `<span class="digital">${hhmm(S.target)}</span>` : ''}`;
  } else if (S.phase === 'frozen' || S.phase === 'spin') {
    el.innerHTML = `<span class="frozen-lbl">Bevroren!</span>${LEVELS[S.level].digital ? `<span class="digital">${hhmm(S.target)}</span>` : ''}`;
  } else if (LEVELS[S.level].digital) {
    el.innerHTML = `<span class="lbl">Schaats naar</span><span class="digital">${hhmm(S.target)}</span>`;
  } else {
    el.innerHTML = `<span class="lbl">Schaats naar</span>${blocks(PHRASES[face(S.target)], cls)}`;
  }
  hits = new Set(); renderLive();
}
function renderLive() {
  const el = $('#live');
  if (S.phase !== 'skate') { el.innerHTML = ''; return; }
  const live = PHRASES[face(S.T)];
  const tip = S.tip || (bigTurn() ? 'Nu de grote wijzer' : '');
  el.innerHTML = `<span class="lbl">Jouw klok zegt</span>${blocks(live)}${tip ? `<span class="nudge">${tip}</span>` : ''}${S.offer && !coach
    ? '<button class="btn ghost samen" type="button" id="samen">Samen doen?</button>' : ''}`;
  if (LEVELS[S.level].digital) return;
  const has = new Set(live.map(([w, r]) => r + ':' + w)), now = new Set();
  $('#target').querySelectorAll('.word').forEach((node, i) => {
    const [w, r] = PHRASES[face(S.target)][i], hit = has.has(r + ':' + w);
    node.classList.toggle('hit', hit);
    if (hit) { now.add(i); if (!hits.has(i)) { node.classList.remove('pop'); void node.offsetWidth; node.classList.add('pop'); SFX.lock(now.size * 2); } }
  });
  hits = now;
}
function renderHud() {
  $('#score').textContent = S.score;
  $('#combo').textContent = S.combo > 1 ? `×${Math.min(S.combo, 5)}` : '';
  $('#level').textContent = LEVELS[S.level].name;
  $('#dots').innerHTML = Array.from({length: S.gates}, (_, i) =>
    `<span class="dot${FROZEN.has(i) ? ' frozen' : ''}${BUILD.has(i) ? ' build' : ''}${i < S.gate ? ' done' : ''}${i === S.gate && S.phase !== 'end' ? ' now' : ''}"></span>`).join('');
}
function popCombo() { const c = $('#combo'); c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }

/* ---------- ronde ---------- */
function pickTarget() {
  const due = S.again.findIndex(a => a.gate <= S.gate);
  if (due >= 0) {
    const [{target}] = S.again.splice(due, 1);
    S.target = target + 1440 * Math.round((S.T - target) / 1440);
    return;
  }
  const L = LEVELS[S.level], options = [];
  for (let d = 10; d <= REACH; d++) for (const t of [S.T + d, S.T - d]) if (L.minutes.includes(mod(t, 60))) options.push(t);
  const weak = focus(), practise = weak ? options.filter(t => trains(t, weak)) : [];
  const pool = practise.length && Math.random() < .5 ? practise : options;
  S.target = pool[Math.floor(Math.random() * pool.length)];
}

/* een tijd die samen gedaan is komt een paar poorten later terug, dan doe je hem zelf */
function again() {
  const gate = Math.max(Math.min(S.gate + AGAIN, S.gates), ...S.again.map(a => a.gate + 1));
  S.again.push({gate, target: S.target});
  S.gates = Math.max(S.gates, gate + 1);
}

function startRun() {
  const start = Math.floor(Math.random() * 24) * 60;
  Object.assign(S, {phase: 'skate', T: start, P: start, disp: start, gate: 0, gates: GATES, again: [], score: 0, combo: 0, best: 0, firstTry: 0, usedHour: false, helped: false, marks: []});
  scratchC.getContext('2d').clearRect(0, 0, 2 * RB + 40, 2 * RB + 40);
  $('#start').hidden = true; $('#end').hidden = true;
  nextGate();
}

/* terug naar het beginscherm, midden in een ronde */
function stopRun() {
  if (coach) stopCoach(performance.now());
  S.phase = 'start'; blast = null; party = null; frost.goal = 0; trail.u = null; panel.hidden = true; $('#target').innerHTML = '';
  renderLive(); renderHud(); renderLevels('#levels'); $('#end').hidden = true; $('#start').hidden = false;
}

function nextGate() {
  if (S.phase === 'start') return;
  renderHud(); S.slips = []; S.example = null; S.together = false; S.tapped = false; S.offer = false;
  if (S.gate === S.gates) return endRun();
  if (BUILD.has(S.gate)) return startBuild();
  if (FROZEN.has(S.gate)) return startFrozen();
  S.phase = 'skate'; pickTarget(); S.gateStart = performance.now(); S.holdSince = 0; S.nudgeSince = 0; S.nudged = false; S.touched = false; S.spun = 0; S.tip = '';
  renderTarget();
  if (!store.get('coached', false)) startCoach(S.gateStart);
}

function passGate(now) {
  logGate('skate', !S.slips.length && !S.together);
  if (S.together) again();
  S.combo = S.together ? 0 : now - S.gateStart < FAST ? S.combo + 1 : 1; S.best = Math.max(S.best, S.combo);
  const pts = S.together ? 50 : 100 * Math.min(S.combo, 5); S.score += pts;
  const [x, y] = at(mod(S.T, 60) / 60 * Math.PI * 2, R * .8);
  burst(x, y, 60); burst(CX, CY, 50, 11); rings.push({x, y, r: 10, life: 1}); floatText(x, y - 40, `+${pts}`);
  kick(14, 90); SFX.gate(S.combo); SFX.shatter(); popCombo();
  blast = {t0: now, dur: S.calm ? 500 : 1400, spins: Array.from({length: 12}, () => (Math.random() - .5) * 1.4)};
  scratchC.getContext('2d').clearRect(0, 0, 2 * RB + 40, 2 * RB + 40);
  $('#target').lastElementChild.classList.add('leave');
  S.gate++; S.phase = 'between';
  setTimeout(nextGate, blast.dur);
}

function endRun() {
  S.phase = 'end'; S.played = S.level; renderHud(); renderLive();
  /* sterren tellen de poorten waar je schrijft of bouwt; de derde ster is alles in één keer en nergens samen gedaan */
  const special = BUILD.size + FROZEN.size, stars = 1 + (S.firstTry >= special / 2) + (S.firstTry === special && !S.helped);
  const gold = allGold(), kept = store.get('stars', []);
  kept[S.level] = Math.max(kept[S.level] || 0, stars); store.set('stars', kept);
  const champion = !gold && allGold();
  let unlocked = '';
  if (stars >= 2 && S.level === S.unlocked && S.unlocked < LEVELS.length - 1) {
    S.unlocked++; store.set('unlocked', S.unlocked); unlocked = `Nieuw niveau open: ${LEVELS[S.unlocked].name}!`;
    S.level = S.unlocked; store.set('level', S.level);
  }
  $('#end-title').textContent = champion ? 'Kampioen!' : 'Klaar!';
  $('#stars').innerHTML = [0, 1, 2].map(i => `<span class="${i < stars ? 'on' : ''}">★</span>`).join('');
  $('#gates').innerHTML = S.marks.map(m => `<span class="${m.first ? 'yes' : 'no'}">${m.first ? '✓' : '✗'}${m.together ? '<small>samen</small>' : ''}</span>`).join('');
  $('#goal').textContent = champion ? 'Alle niveaus goud!' : stars === 3 ? 'Goud!' : stars === 2
    ? (S.firstTry === special ? '★★★ = alles zelf, zonder Samen doen' : `★★★ = alle ${special} in één keer goed, zonder Samen doen`)
    : `★★ = ${special / 2} van de ${special} in één keer goed`;
  $('#stats').innerHTML = `<div><b>${S.score}</b><span>punten</span></div><div><b>×${Math.min(S.best, 5)}</b><span>beste reeks</span></div>`;
  $('#unlock').textContent = unlocked;
  renderLevels('#levels-end');
  $('#target').innerHTML = '';
  if (stars < 2) return showEnd(stars);
  S.phase = 'party'; party = celebrate(champion);
  setTimeout(showEnd, party.dur, stars);
}

function showEnd(stars) {
  if (S.phase === 'start') return;
  const champion = party && party.champion;
  S.phase = 'end'; party = null; trail.u = stop(S.played)[0]; trail.hold = performance.now() + 900;
  $('#end').hidden = false; SFX.fanfare(); cannons(40 + stars * 30 + (champion ? 120 : 0));
}

/* beste sterren per niveau; wie al verder was voor de sterren bewaard werden, had daar minstens twee */
const best = i => Math.max(store.get('stars', [])[i] || 0, i < S.unlocked ? 2 : 0);
const allGold = () => LEVELS.every((l, i) => best(i) === 3);
const celebrate = champion => ({t0: performance.now(), dur: champion ? (S.calm ? 3500 : 13000) : (S.calm ? 1200 : 4600), level: S.played,
  champion, slow: 1, jumped: false, cheered: false, next: 0, boarded: false, glass: null});

/* alles goud: de beker aan het eind van de lijn speelt het kampioensfeest nog een keer */
function replayChampion() {
  audio(); $('#start').hidden = true; S.phase = 'party';
  const mine = party = celebrate(true);
  setTimeout(() => { if (party !== mine) return; party = null; S.phase = 'start'; trail.u = null; $('#start').hidden = false; }, mine.dur);

/* dezelfde schaatser van voren (of van achteren, zonder gezicht), juichend: elk niveau met een eigen gebaar */

    pump: [[-8, -22], [10, -42 - Math.max(0, wig) * 6]],
    clap: [[-2 - Math.abs(wig) * 6, -47], [2 + Math.abs(wig) * 6, -47]],

  hands.forEach(([hx, hy], i) => {
    const sh = [i ? 5 : -5, -29], elbow = [(sh[0] + hx) / 2 + (i ? 3 : -3), (sh[1] + hy) / 2 + 2];
    limb(sh, elbow, 3.8, suit); limb(elbow, [hx, hy], 3.6, suit);

  if (face) {
    ctx.fillStyle = BOOT; ctx.beginPath(); ctx.arc(-1.9, -37.5, .8, 0, Math.PI * 2); ctx.arc(1.9, -37.5, .8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = BOOT; ctx.lineWidth = .9; ctx.beginPath(); ctx.arc(0, -36, 2.4, .2 * Math.PI, .8 * Math.PI); ctx.stroke();
  }
  ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(0, -38.3, 5.8, Math.PI * (face ? 1.02 : .9), Math.PI * (face ? 1.98 : 2.1)); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -45, 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* de schaatser zoals een camera die om hem heen draait hem ziet: yaw 0 is van voren, een kwart slag van opzij */
function turntable(x, y, s, yaw, pose, t, speed, [suit, accent]) {
  const front = Math.cos(yaw), side = Math.sin(yaw);
  ctx.save(); ctx.translate(x, y);
  if (Math.abs(front) >= Math.abs(side)) {
    ctx.scale(Math.max(.3, Math.abs(front)), 1);
    skaterFront(0, 0, s, suit, accent, pose, t, front > 0);
  } else {
    ctx.scale(Math.max(.3, Math.abs(side)), 1);
    skater(0, 0, s, suit, accent, t * 11, speed, Math.sign(side));

}

/* niveau gehaald: de schaatser komt van links, springt, en in slowmotion draait de camera om hem heen (de confetti blijft
   hangen); hij landt met zijn gezicht naar je toe en juicht. Elk niveau draait anders en juicht anders. */
const PARTIES = [
  {pose: 'v', turns: 1, way: 1, tilt: 0},
  {pose: 'wave', turns: 1, way: -1, tilt: .06},
  {pose: 'pump', turns: 2, way: 1, tilt: -.06},
  {pose: 'clap', turns: 2, way: -1, tilt: .1},
  {pose: 'star', turns: 3, way: 1, tilt: -.1},
];
const PARTY = {lift: .12, zoom: .45, dark: .7, suit: ['#FF4FB3', '#FFD34E'], keys: [.22, .3, .74, .8], ghosts: 0, cheer: 'Wieeew!'};
/* alle niveaus goud: een gouden schaatser, hoger en langer in de lucht, drie slagen met alle gebaren, in bullet-time met
   nabeelden, en daarna vuurwerk */
const CHAMPION = {pose: 'star', poses: ['v', 'pump', 'clap', 'wave', 'star'], turns: 3, way: 1, tilt: .16, lift: .15, zoom: .6, dark: .88,
  suit: ['#FFD34E', '#FF4FB3'], keys: [.1, .15, .46, .5], ghosts: 5, cheer: ''};
/* daarna worden de ijzers een flyboard: opstijgen, rondvliegen, op de camera af en krak, tegen het scherm */
const FLY = [.6, .83, .9];
let party = null;
const span = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));

function drawParty(now) {
  const look = {...PARTY, ...(party.champion ? CHAMPION : PARTIES[party.level])}, [k1, k2, k3, k4] = look.keys;
  const t = Math.min(1, (now - party.t0) / party.dur), size = Math.min(W, H) / 170;
  const ground = H * .64, skate = span(t, 0, k1), rise = span(t, k1, k2), orbit = span(t, k2, k3), drop = span(t, k3, k4);
  const zoom = 1 + look.zoom * Math.sin(Math.PI * span(t, k1 + .04, k4)), calm = S.calm;
  const sweep = look.way > 0 ? 2 * Math.PI * look.turns - Math.PI / 2 : -(Math.PI / 2 + 2 * Math.PI * (look.turns - 1));
  const turn = calm ? () => 0 : o => Math.PI / 2 + ease(o) * sweep, yaw = turn(orbit);
  const air = ground - (Math.sin(Math.PI / 2 * rise) * (1 - drop)) * H * look.lift - Math.sin(Math.PI * orbit) * H * .02;
  const x = -60 + (W / 2 + 60) * (1 - Math.pow(1 - skate, 2));
  const pose = look.poses && orbit < 1 ? look.poses[Math.min(look.poses.length - 1, Math.floor(orbit * look.poses.length))] : look.pose;
  party.slow = orbit > 0 && orbit < 1 && !calm ? .12 : 1;
  ctx.save(); ctx.fillStyle = `rgba(22,10,54,${Math.min(look.dark, t * 3)})`; ctx.fillRect(0, 0, W, H); ctx.restore();
  if (party.champion) spotlights(now, t, x, ground);
  ctx.save();
  const focus = [x, air - 20 * size];
  ctx.translate(...focus); ctx.rotate(look.tilt * Math.sin(Math.PI * span(t, k1 + .04, k4))); ctx.scale(zoom, zoom); ctx.translate(-focus[0], -focus[1]);
  if (party.slow < 1) {
    ctx.save(); ctx.strokeStyle = 'rgba(62,232,255,.18)'; ctx.lineWidth = 2;
    for (let i = 0; i < 24; i++) {
      const a = i / 24 * Math.PI * 2 + yaw * .5, r0 = 60 * size, r1 = r0 + 25 * size * (1 + (i % 3));
      ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r0, air - 20 * size + Math.sin(a) * r0); ctx.lineTo(x + Math.cos(a) * r1, air - 20 * size + Math.sin(a) * r1); ctx.stroke();
    }
    ctx.restore();
  }
  const flying = party.champion && t >= FLY[0];
  if (!flying) {
  ctx.save(); ctx.translate(x, ground + 2 * size); ctx.scale(1, .22);
  ctx.strokeStyle = 'rgba(62,232,255,.5)'; ctx.lineWidth = 3 / .22; ctx.beginPath(); ctx.arc(0, 0, 34 * size, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#FFD34E';
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2 + yaw; if (Math.sin(a) > 0) { ctx.beginPath(); ctx.arc(Math.cos(a) * 34 * size, Math.sin(a) * 34 * size, 1.6 * size, 0, Math.PI * 2); ctx.fill(); } }
  ctx.restore();
  if (party.slow < 1) for (let i = look.ghosts; i > 0; i--) {
    ctx.save(); ctx.globalAlpha = .1 + .05 * (look.ghosts - i);
    turntable(x, air, size, turn(Math.max(0, orbit - i * .018)), pose, now / 1000, 1, look.suit); ctx.restore();
  }
  turntable(x, air, size, t < k1 ? Math.PI / 2 : yaw, pose, now / 1000, skate < 1 ? 7 : 1, look.suit);
  }
  ctx.restore();

  if (rise > 0 && !party.jumped) { party.jumped = true; burst(x, air - 20 * size, 140, 13); SFX.hop(); }
  if (drop >= 1 && !party.cheered) {
    party.cheered = true;
    if (look.cheer) floatText(W / 2, ground - 75 * size, look.cheer, '#FFD34E');
    burst(W / 2, ground - 30 * size, 90, 10); SFX.gate(5); kick(10, 0);
  }
  if (party.champion && party.cheered) {
    const pop = Math.min(1, (t - k4) / .05), big = Math.min(W / 7, 92) * (calm ? 1 : .6 + .4 * pop + .04 * Math.sin(now / 160));
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `400 ${Math.round(big)}px Monoton, sans-serif`;
    ctx.fillStyle = '#FFD34E'; ctx.shadowColor = '#FFD34E'; ctx.shadowBlur = 30; ctx.fillText('KAMPIOEN!', W / 2, H * .17); ctx.restore();
  }
  if (party.champion && party.cheered && !party.glass && now > party.next) {
    party.next = now + (calm ? 900 : 380);
    const [fx, fy] = [W * (.12 + .76 * Math.random()), H * (.1 + .3 * Math.random())];
    burst(fx, fy, 70, 9); rings.push({x: fx, y: fy, r: 6, life: 1}); SFX.gate(1 + Math.floor(Math.random() * 5));
  }
}

/* ---------- de volglijn: alle niveaus op één lijn, zoals in een bouwboekje; de schaatser staat waar je bent en elk stuk lijn
   heeft de kleur van de sterren op dat niveau, zodat je ziet waar nog goud te halen is ---------- */
const TRAIL = ['rgba(205,187,255,.55)', '#E39A5F', '#DCE6F5', '#FFD34E'], LOCKED = 'rgba(205,187,255,.16)', CUP = .95;
const stop = i => { const u = .07 + .185 * i; return [u, trailY(u)]; };
function trailY(u) { return .56 - .1 * Math.cos((u - .07) / .185 * Math.PI); }
const trail = {u: null, hold: 0, phase: 0, speed: 0, dir: 1};

/* het flyboard: van de landingsplek omhoog, een rondje door het scherm met waterstralen, dan recht op je af tot hij het
   glas raakt; daar blijft hij even plakken en glijdt omlaag, en het scherm heeft een barst */
function flight(now, t, size, ground, [suit, accent]) {
  const go = span(t, FLY[0], FLY[1]), near = span(t, FLY[1], FLY[2]), slide = span(t, FLY[2], 1);
  const roam = p => [W / 2 + W * .32 * Math.sin(Math.PI * 2 * p * 1.5), H * .5 + H * .16 * Math.sin(Math.PI * 2 * p * 2 + .4)];
  const lift = Math.min(1, go * 6), [rx, ry] = roam(go), [ex, ey] = roam(1), hit = [W / 2, H * .45], biggest = H * 1.1 / (50 * size);
  let [x, y] = [W / 2 + (rx - W / 2) * lift, ground - 25 * size + (ry - ground + 25 * size) * lift], scale = 1.25, tilt = Math.cos(Math.PI * 2 * go * 1.5) * .35 * lift;
  if (near > 0) { [x, y] = towards([ex, ey], hit, near); scale = 1.25 + (biggest - 1.25) * near * near; tilt *= 1 - near; }
  if (slide > 0) { scale = biggest; y = hit[1] + H * .3 * ease(slide); tilt = .12 * Math.sin(slide * 3); }
  if (go > 0 && !party.boarded) { party.boarded = true; burst(W / 2, ground - 10 * size, 80, 9); SFX.hop(); }
  if (near < 1) spray(x, y + 28 * size * scale, 0, -1, 3);
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);
  if (slide > 0) { ctx.scale(1.08, .94); ctx.globalAlpha = 1 - span(slide, .7, 1); }
  skaterFront(0, 25 * size * scale, size * scale, suit, accent, slide > 0 ? 'star' : 'v', now / 1000, true, near < 1);
  ctx.restore();
  if (near >= 1 && !party.glass) {
    party.glass = cracks(...hit); SFX.crack(); SFX.shatter(); kick(26, 140); burst(...hit, 120, 14, 'confetti'); rings.push({x: hit[0], y: hit[1], r: 10, life: 1});
  }
  if (party.glass) {
    ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.shadowColor = '#BFF3FF'; ctx.shadowBlur = 8;
    const glow = ctx.createRadialGradient(...hit, 0, ...hit, 70); glow.addColorStop(0, 'rgba(255,255,255,.55)'); glow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(...hit, 70, 0, Math.PI * 2); ctx.fill();
    for (const {pts, w} of party.glass) { ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(...pts[0]); for (const q of pts.slice(1)) ctx.lineTo(...q); ctx.stroke(); }
    ctx.restore();
  }
}

/* een barst in het glas: kronkelende stralen vanuit de klap en wat stukjes ring ertussen */
function cracks(cx, cy) {
  const lines = [], rays = 16, reach = Math.max(W, H);
  for (let i = 0; i < rays; i++) {
    let a = (i + Math.random() * .6) / rays * Math.PI * 2;
    const pts = [[cx, cy]], end = reach * (.2 + Math.random() * .45);
    for (let r = 0; r < end; r += 18 + Math.random() * 46) { a += (Math.random() - .5) * .45; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
    lines.push({pts, w: 1.2 + Math.random() * 1.8});
  }
  for (const ring of [36, 85, 150]) for (let i = 0; i < rays; i++) {
    if (Math.random() < .35) continue;
    const a0 = i / rays * Math.PI * 2, a1 = (i + 1) / rays * Math.PI * 2, r0 = ring * (.85 + Math.random() * .3), r1 = ring * (.85 + Math.random() * .3);
    lines.push({pts: [[cx + Math.cos(a0) * r0, cy + Math.sin(a0) * r0], [cx + Math.cos(a1) * r1, cy + Math.sin(a1) * r1]], w: 1});
  }
  return lines;
}

/* zoeklichten van onder uit de hoeken, die de schaatser zoeken en na de landing rond zwaaien */
function spotlights(now, t, x, ground) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [side, color] of [[0, 'rgba(255,211,78,'], [1, 'rgba(62,232,255,'], [.5, 'rgba(255,79,179,']]) {
    const bx = W * side, by = H + 20, sway = S.calm ? 0 : Math.sin(now / 700 + side * 4) * W * .18 * Math.min(1, t * 2);
    const tx = x + sway, ty = ground - H * .25, a = Math.atan2(ty - by, tx - bx), spread = .09, len = Math.hypot(tx - bx, ty - by) * 1.4;
    const g = ctx.createRadialGradient(bx, by, 0, bx, by, len);
    g.addColorStop(0, color + '.32)'); g.addColorStop(1, color + '0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(bx, by);
    ctx.lineTo(bx + Math.cos(a - spread) * len, by + Math.sin(a - spread) * len); ctx.lineTo(bx + Math.cos(a + spread) * len, by + Math.sin(a + spread) * len);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function renderLevels(sel) {
  $(sel).innerHTML = `<canvas></canvas>${LEVELS.map((l, i) => {
    const [u, v] = stop(i), n = best(i);
    return `<button class="lv" type="button" data-level="${i}" aria-pressed="${i === S.level}" ${i > S.unlocked ? 'disabled' : ''}
      style="left:${u * 100}%;top:${v * 100}%;--c:${i > S.unlocked ? LOCKED : TRAIL[n]}" aria-label="${l.name}, ${n} van 3 sterren"><b>${i + 1}</b>${l.name}<i>${'★'.repeat(n)}<em>${'★'.repeat(3 - n)}</em></i></button>`;
  }).join('')}<button class="cup" type="button" style="left:${CUP * 100}%;top:${trailY(CUP) * 100}%" aria-label="Alles goud" ${allGold() ? '' : 'disabled'}></button>`;
  $(sel).querySelectorAll('.lv').forEach(b => b.addEventListener('click', () => {
    S.level = +b.dataset.level; store.set('level', S.level); renderLevels(sel); renderHud();
  }));
  $(sel).querySelector('.cup').addEventListener('click', () => { if (S.phase === 'start') replayChampion(); });
  $('#again').textContent = S.level === S.played ? 'Nog een rondje' : `Naar ${LEVELS[S.level].name}!`;
}

function drawTrail(now, dt) {
  const box = !$('#end').hidden ? $('#levels-end') : !$('#start').hidden ? $('#levels') : null;
  if (!box) return;
  const c = box.querySelector('canvas'), w = box.clientWidth, h = box.clientHeight;
  if (c.width !== Math.round(w * DPR) || c.height !== Math.round(h * DPR)) { c.width = Math.round(w * DPR); c.height = Math.round(h * DPR); }
  const main = ctx; ctx = c.getContext('2d'); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, w, h);
  const pt = u => [u * w, trailY(u) * h], stars = LEVELS.map((l, i) => best(i)), gold = stars.every(n => n === 3);
  LEVELS.forEach((l, i) => {
    const from = i ? (stop(i - 1)[0] + stop(i)[0]) / 2 : .02, to = i < LEVELS.length - 1 ? (stop(i)[0] + stop(i + 1)[0]) / 2 : CUP;
    const color = i > S.unlocked ? LOCKED : TRAIL[stars[i]];
    ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = 7; ctx.strokeStyle = color;
    if (i > S.unlocked) ctx.setLineDash([2, 12]);
    if (stars[i] === 3) { ctx.shadowColor = '#FFD34E'; ctx.shadowBlur = 14; }
    ctx.beginPath(); ctx.moveTo(...pt(from));
    for (let u = from; u < to; u += .004) ctx.lineTo(...pt(u));
    ctx.lineTo(...pt(to)); ctx.stroke(); ctx.restore();
  });
  const [cx, cy] = pt(CUP);
  ctx.save(); ctx.translate(cx, cy); ctx.lineJoin = 'round';
  ctx.fillStyle = gold ? '#FFD34E' : 'rgba(205,187,255,.12)'; ctx.strokeStyle = gold ? '#FFF3C4' : 'rgba(205,187,255,.4)'; ctx.lineWidth = 2;
  if (gold) { ctx.shadowColor = '#FFD34E'; ctx.shadowBlur = 18 + 8 * Math.sin(now / 300); }
  ctx.beginPath(); ctx.moveTo(-15, -40); ctx.lineTo(15, -40); ctx.quadraticCurveTo(15, -18, 3, -15); ctx.lineTo(3, -8); ctx.lineTo(10, -4);
  ctx.lineTo(10, 0); ctx.lineTo(-10, 0); ctx.lineTo(-10, -4); ctx.lineTo(-3, -8); ctx.lineTo(-3, -15); ctx.quadraticCurveTo(-15, -18, -15, -40); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(-15, -32, 6, Math.PI * .5, Math.PI * 1.5); ctx.arc(15, -32, 6, Math.PI * 1.5, Math.PI * .5); ctx.stroke();
  ctx.restore();
  const goal = stop(S.level)[0];
  if (trail.u === null) trail.u = goal;
  /* de beentjes gaan zo snel als hij echt schaatst: op gang komen, glijden en bij het niveau rustig uitbollen */
  const left = goal - trail.u, step = now > trail.hold ? Math.sign(left) * Math.min(Math.abs(left), dt * .0005 * Math.min(1, .25 + Math.abs(left) / .06)) : 0;
  trail.u += step;
  const pace = Math.abs(step) * w / dt;
  trail.speed = trail.speed * .85 + pace * 2.2 * .15; trail.phase += dt * .004 + Math.abs(step) * w * .12;
  if (step) trail.dir = Math.sign(step);
  const [sx, sy] = pt(trail.u);
  skater(sx, sy - 24, Math.min(1.35, w / 420), '#FF4FB3', '#FFD34E', trail.phase, .3 + Math.min(3, trail.speed), trail.dir);
  ctx = main;
}

/* ---------- bevroren poort: het taalmodel leest mee ---------- */
const panel = $('#panel');
/* op de Mac beantwoordt de server, op school Python in de browser (Pyodide) met dezelfde regels */
const ENGINE = document.querySelector('meta[name="engine"]').content, PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.28.3/full/';
let py = null;

async function engine() {
  await new Promise((done, fail) => {
    const script = document.createElement('script');
    script.src = PYODIDE + 'pyodide.js'; script.onload = done; script.onerror = () => fail(new Error('Pyodide laadt niet'));
    document.head.append(script);
  });
  const pyodide = await loadPyodide({indexURL: PYODIDE});
  await pyodide.loadPackage('pydantic');
  for (const file of ['klok.py', 'play.py']) pyodide.FS.writeFile(file, await (await fetch(file)).text());
  pyodide.runPython('import sys; sys.path.insert(0, ".")');
  py = pyodide.pyimport('play');
}

async function api(path, body) {
  if (ENGINE === 'browser') return JSON.parse(await py.browser(path.slice(1), JSON.stringify(body)));
  const r = await fetch(path, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error(`${path} gaf ${r.status}: ${await r.text()}`);
  return r.json();
}
function show(html) { if (S.phase === 'start') return; panel.hidden = false; panel.innerHTML = html; }
function thinking(text) { show(`<div class="thinking"><i></i><i></i><i></i>${text}</div>`); }
function failed(err, retry) {
  show(`<p class="ask">Er ging iets mis met de leraar.</p><p class="sub">${esc(String(err.message || err))}</p><div class="choices"><button class="btn primary" type="button" id="retry">Opnieuw</button></div>`);
  $('#retry').addEventListener('click', retry);
}
const clock = () => ({hour: Math.floor(mod(S.target, 1440) / 60), minute: mod(S.target, 60)});

function spinTo(then) {
  S.phase = 'spin'; pickTarget(); renderTarget(); renderLive();
  const from = S.T, to = S.target, t0 = performance.now(), dur = S.calm ? 10 : 1100;
  const spin = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    S.T = Math.round(from + (to - from) * e); S.P = S.T;
    if (S.phase !== 'spin') return;
    if (p < 1) return requestAnimationFrame(spin);
    S.T = S.P = to; then();
  };
  requestAnimationFrame(spin);
}

function startFrozen() {
  S.attempts = 0; S.misses = 0; frost.cracks = []; frostC = null;
  spinTo(() => { S.phase = 'frozen'; frost.goal = 1; SFX.freeze(); kick(6, 0); write(); });
}

function write(note = '', example = null) {
  show(`<p class="ask">${note || 'Schrijf de tijd.'}</p>${example ? `${blocks(example, 'enter')}<p class="sub">Schrijf het nu zelf.</p>` : ''}
    <form id="form"><input id="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Jouw antwoord" placeholder="schrijf hier…">
    <button class="btn primary" type="submit">Ontdooi!</button><button class="btn ghost" type="button" id="samen-write">Samen doen</button></form>`);
  const input = $('#answer'); setTimeout(() => input.focus(), 50);
  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    if (input.value.trim()) return read(input.value.trim());
    panel.querySelector('.ask').textContent = 'Schrijf eerst de tijd.'; SFX.soft();
  });
  /* op een tablet is de tik naast het toetsenbord om de klok weer te zien geen Samen doen: die tik sluit alleen het toetsenbord */
  let closing = false;
  $('#samen-write').addEventListener('pointerdown', e => { closing = e.pointerType !== 'mouse' && document.activeElement === input; });
  $('#samen-write').addEventListener('click', () => { if (closing) { closing = false; return input.blur(); } together(); });
}

async function read(text) {
  thinking('Even lezen…');
  let res;
  try { res = await api('/read', {...clock(), text}); } catch (err) { return failed(err, () => read(text)); }
  S.attempts++;
  for (const step of res.dialogue ? res.dialogue.steps : []) slip(step.mistake, 'geschreven', text);
  if (res.verdict === 'unreadable') return S.attempts >= 2 ? together() : write('Dat kan ik niet lezen. Nog een keer?');
  if (res.verdict === 'right' || res.verdict === 'other_words') {
    const first = S.attempts === 1;
    show(res.verdict === 'right'
      ? `<p class="ask">Ik lees:</p>${blocks(res.said, 'enter')}<p class="ask">Helemaal goed!</p>`
      : `<p class="ask">Dat klopt! Meestal zeggen we:</p>${blocks(res.right, 'enter')}`);
    return thaw(first ? 300 : 150, first);
  }
  show(`<p class="ask">Ik lees:</p>${blocks(res.said, 'enter')}<p class="ask">Bedoel je dat?</p>
    <div class="choices"><button class="btn primary" type="button" id="yes">Ja</button><button class="btn ghost" type="button" id="no">Nee, opnieuw</button></div>`);
  $('#yes').addEventListener('click', () => S.attempts >= 2 ? together() : ask(res.dialogue));
  $('#no').addEventListener('click', () => S.attempts >= 2 ? together() : write('Schrijf het nog een keer.'));
  SFX.soft();
}

async function ask(dialogue) {
  thinking('Even denken…');
  let q;
  try { q = await api('/ask', dialogue); } catch (err) { return failed(err, () => ask(dialogue)); }
  question(q);
}

function question(q) {
  const bar = Array.from({length: q.total}, (_, i) => `<b class="${i < q.number ? 'on' : ''}"></b>`).join('');
  show(`<div class="steps">${bar}</div><p class="ask" style="margin-top:14px">${esc(q.question)}</p>
    <div class="choices">${q.options.map(o => `<button class="btn" type="button">${esc(o)}</button>`).join('')}</div><p class="hint" id="hint"></p>`);
  panel.querySelectorAll('.choices .btn').forEach(b => b.addEventListener('click', () => choose(q, b.textContent)));
}

async function choose(q, choice) {
  let res;
  try { res = await api('/step', {dialogue: q.dialogue, choice}); } catch (err) { return failed(err, () => choose(q, choice)); }
  if (!res.correct) {
    $('#hint').textContent = res.hint; SFX.soft();
    panel.classList.remove('wobble'); void panel.offsetWidth; panel.classList.add('wobble');
    return;
  }
  crack(); SFX.crack(); kick(5, 40);
  if (res.done) return write('Goed zo! Zo zeg je het:', res.right);
  question(res);
}

/* samen doen bij een poort: eerst de vragen die nodig zijn, dan bouwen we de zin met de blokjes; de tijd komt later terug */
async function together() {
  S.together = true;
  let res;
  try { res = await api('/together', {...clock(), digital: !!LEVELS[S.level].digital}); } catch (err) { return failed(err, together); }
  walk(res.steps, 0);
}

function walk(steps, i) {
  if (i === steps.length) return build('Samen. Tik de tijd.');
  const q = steps[i];
  show(`<p class="ask">${esc(q.ask)}</p>
    <div class="choices">${q.options.map(o => `<button class="btn" type="button">${esc(o)}</button>`).join('')}</div><p class="hint" id="hint"></p>`);
  panel.querySelectorAll('.choices .btn').forEach(b => b.addEventListener('click', () => {
    if (b.textContent === q.answer) { crack(); SFX.crack(); return walk(steps, i + 1); }
    $('#hint').textContent = q.hint; SFX.soft();
  }));
}

function thaw(points, first) {
  logGate(S.phase === 'build' ? 'build' : 'frozen', first); S.phase = 'between';
  if (S.together) again();
  if (first) { S.firstTry++; S.combo++; S.best = Math.max(S.best, S.combo); popCombo(); }
  const pts = points * Math.max(1, Math.min(S.combo, 5));
  setTimeout(() => {
    shatter(); SFX.shatter(); floatText(CX, CY - R * .3, `+${pts}`, '#DFF7FF');
    S.score += pts; S.gate++; panel.hidden = true;
    setTimeout(nextGate, S.calm ? 200 : 900);
  }, 900);
}

/* ---------- zinnen bouwen: woordblokjes, de regels komen van de server ---------- */
function startBuild() { spinTo(() => { S.phase = 'build'; S.misses = 0; build(); }); }

const label = (word, digit) => digit ? `<span>${digit}</span><small>${esc(word)}</small>` : esc(word);

async function build(lead = 'Tik de tijd.') {

  show(`<p class="ask">${lead}</p>${S.together ? example() : ''}<div class="built" id="built"><span class="slot"></span>
    <button class="btn ghost back" id="back" type="button" hidden aria-label="Laatste blokje terug"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button></div>
    <div class="tray">${res.tray.map(([w, d]) => `<button class="word" type="button" data-word="${esc(w)}" data-digit="${d || ''}">${label(w, d)}</button>`).join('')}</div>
    <p class="hint" id="hint"></p>${S.together ? '' : '<div class="choices"><button class="btn ghost" type="button" id="samen-build">Samen doen</button></div>'}`);

    S.together = true; $('#built').insertAdjacentHTML('beforebegin', example()); e.target.parentElement.remove();
  });
}
const example = () => `<p class="sub">Zo gaat de tijd:</p><div class="ghost-line">${blocks(PHRASES[face(S.target)])}</div>`;

async function tap(block) {
  const {word, digit} = block.dataset;
  let res;
  try { res = await api('/place', {...clock(), placed: S.placed, word}); } catch (err) { return failed(err, () => tap(block)); }
  if (res.hint) {
    S.misses++; slip(res.mistake, 'als blokje gekozen', word); $('#hint').textContent = res.hint; SFX.soft();
    block.classList.remove('nope'); void block.offsetWidth; block.classList.add('nope');

/* per ongeluk getikt: het laatste blokje gaat terug naar de bak */
function back() {

  $('#back').hidden = !S.placed.length;

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>IJsbaan-klok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Syne:wght@400;600;700;800&display=swap">
<style>
:root{
  --night:#160A36; --night-2:#1F0F4D; --ink:#FFFFFF; --lilac:#CDBBFF; --mute:#9C8CD6;
  --pink:#FF4FB3; --cyan:#3EE8FF; --gold:#FFD34E; --line:rgba(205,187,255,.22);
  --f-neon:"Monoton","Arial Black",sans-serif; --f-main:"Syne","Avenir Next",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font:400 17px/1.4 var(--f-main);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:max(12px,env(safe-area-inset-top)) 18px 0;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.hud .left,.hud .right{display:flex;align-items:center;gap:10px;min-width:0}
.score{font:400 clamp(26px,4vw,40px)/1 var(--f-neon);color:var(--cyan);text-shadow:0 0 14px rgba(62,232,255,.7);font-variant-numeric:tabular-nums}
.combo{font:800 22px/1 var(--f-main);color:var(--pink);text-shadow:0 0 12px rgba(255,79,179,.6);min-width:3ch}
.combo.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);transition:all .2s}
.dot.frozen{border-radius:3px;transform:rotate(45deg) scale(.9)}
.dot.build{border-radius:3px;border-color:rgba(255,211,78,.55)}
.dot.now{border-color:var(--pink);box-shadow:0 0 10px rgba(255,79,179,.6)}
.dot.done{background:var(--cyan);border-color:var(--cyan)}
.chip{all:unset;cursor:pointer;font:700 13px/1 var(--f-main);color:var(--lilac);border:1.5px solid var(--line);border-radius:999px;padding:9px 13px;white-space:nowrap}
.chip[aria-pressed="false"]{opacity:.55}
.level{font:700 13px/1 var(--f-main);letter-spacing:.14em;text-transform:uppercase;color:var(--lilac);white-space:nowrap}

.target{position:fixed;left:0;right:0;top:64px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;z-index:4;padding:0 16px}
.target .lbl,.live .lbl{font:700 12px/1 var(--f-main);letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
.blocks{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.word{font:800 clamp(22px,3.8vw,40px)/1 var(--f-main);padding:12px 16px 13px;border-radius:16px;border:2.5px solid;background:rgba(10,4,30,.6);
  color:var(--c);border-color:var(--c);--c:#fff;transition:background .15s,box-shadow .15s}
.word.number{--c:#FFFFFF}.word.to-hour{--c:var(--cyan)}.word.to-half,.word.half{--c:var(--pink)}.word.hour{--c:var(--gold)}
.target .word.hit{background:color-mix(in srgb,var(--c) 24%,rgba(10,4,30,.6));box-shadow:0 0 26px color-mix(in srgb,var(--c) 70%,transparent)}
.word.pop{animation:pop .32s cubic-bezier(.2,1.6,.4,1)}
.blocks.enter .word{animation:drop .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*70ms)}
.blocks.leave .word,.digital.leave{animation:leave .3s ease-in both}
.digital{font:400 clamp(46px,8vw,84px)/1 var(--f-neon);color:var(--cyan);text-shadow:0 0 .12em rgba(62,232,255,.75);font-variant-numeric:tabular-nums}
.frozen-lbl{font:800 clamp(28px,4.4vw,44px)/1 var(--f-main);color:#DFF7FF;text-shadow:0 0 20px rgba(160,230,255,.9)}

.live{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:4;padding:0 16px}
.live .word{font-size:clamp(16px,2.4vw,24px);padding:8px 12px 9px;border-width:2px;opacity:.92}
.live .lbl{color:var(--mute)}

.panel{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(660px,calc(100% - 28px));z-index:6;
  background:rgba(22,10,54,.94);border:1.5px solid rgba(160,230,255,.55);border-radius:26px;padding:22px;box-shadow:0 0 50px rgba(120,210,255,.18);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.panel[hidden]{display:none}
.panel.wobble{animation:wobble .4s}
.panel .who{font:700 12px/1 var(--f-main);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px;display:flex;justify-content:space-between;gap:10px}
.panel .who span:last-child{color:var(--mute);letter-spacing:.08em}
.panel .ask{font:800 clamp(21px,3vw,27px)/1.3 var(--f-main);margin:0 0 6px}
.panel .sub{color:var(--lilac);margin:0 0 14px}
.panel .blocks{justify-content:flex-start;margin:10px 0 16px}
.panel .blocks .word{font-size:clamp(18px,2.6vw,26px);padding:9px 13px 10px}
.panel form{display:flex;gap:10px;flex-wrap:wrap}
.panel input{flex:1 1 260px;min-width:0;font:800 clamp(22px,3vw,28px)/1.2 var(--f-main);padding:15px 18px;border-radius:16px;border:2px solid var(--line);
  background:#0D0626;color:#fff;outline:none;-webkit-user-select:text;user-select:text}
.panel input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(62,232,255,.15)}
.choices{display:flex;flex-wrap:wrap;gap:12px}
.btn{all:unset;cursor:pointer;font:800 clamp(19px,2.6vw,23px)/1 var(--f-main);padding:17px 24px;border-radius:18px;background:var(--night-2);border:2px solid var(--line);color:#fff;
  transition:transform .12s,border-color .12s;text-align:center}
.btn:hover{border-color:var(--cyan);transform:translateY(-2px)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.btn.primary{background:var(--pink);border-color:var(--pink);color:var(--night)}
.btn.ghost{background:transparent}
.hint{margin:14px 0 0;color:var(--gold);font-weight:700;min-height:1.4em}
.thinking{display:flex;align-items:center;gap:12px;font:800 22px var(--f-main);color:#DFF7FF;padding:8px 0}
.thinking i{width:12px;height:12px;border-radius:50%;background:var(--cyan);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
.built{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:62px;margin:6px 0 18px}
.built .slot{width:64px;height:52px;border-radius:16px;border:2.5px dashed var(--line);animation:blink 1.4s infinite}
.tray{display:flex;flex-wrap:wrap;gap:10px}
.tray .word{all:unset;cursor:pointer;font:800 clamp(18px,2.6vw,26px)/1 var(--f-main);padding:12px 16px 13px;border-radius:16px;border:2.5px solid var(--line);color:#fff;background:var(--night-2)}
.tray .word:hover{border-color:var(--cyan)}
.tray .word.nope{animation:wobble-x .35s}
@keyframes wobble-x{25%{transform:translateX(-8px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.steps{display:flex;gap:6px}.steps b{width:26px;height:6px;border-radius:3px;background:var(--line)}.steps b.on{background:var(--cyan)}

.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;background:rgba(22,10,54,.72);padding:24px;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.overlay[hidden]{display:none}
.card{text-align:center;max-width:720px;display:grid;gap:18px;justify-items:center}
.title{font:400 clamp(46px,10vw,118px)/1 var(--f-neon);color:var(--pink);text-shadow:0 0 .1em rgba(255,79,179,.8),0 0 .4em rgba(255,79,179,.35);margin:0}
.card p{margin:0;color:var(--lilac);font-size:clamp(17px,2.2vw,21px);max-width:46ch}
.levels{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.lv{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);font:700 16px var(--f-main);color:var(--lilac)}
.lv b{font:400 20px/1 var(--f-neon);color:var(--gold)}
.lv[aria-pressed="true"]{border-color:var(--pink);color:#fff;box-shadow:0 0 22px rgba(255,79,179,.35)}
.lv:disabled{opacity:.35;cursor:not-allowed}
.stars{font-size:clamp(48px,9vw,84px);letter-spacing:.1em;line-height:1}
.stars span{color:rgba(205,187,255,.2)}.stars span.on{color:var(--gold);text-shadow:0 0 24px rgba(255,211,78,.8)}
.stats{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.stats div{display:grid;gap:4px}.stats b{font:400 clamp(30px,5vw,48px)/1 var(--f-neon);color:var(--cyan)}.stats span{color:var(--mute);font-size:14px}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes drop{from{transform:translateY(-34px) scale(.6);opacity:0}}
@keyframes leave{to{transform:scale(1.35);opacity:0;filter:blur(3px)}}
@keyframes wobble{20%{transform:translateX(calc(-50% - 10px))}40%{transform:translateX(calc(-50% + 8px))}60%{transform:translateX(calc(-50% - 5px))}80%{transform:translateX(calc(-50% + 3px))}}
@keyframes blink{50%{opacity:.25;transform:scale(.7)}}
body.calm *{animation:none!important;transition:none!important}
@media (max-width:640px){.hud .level{display:none}.dot{width:10px;height:10px}.dots{gap:5px}}
</style>
</head>
<body>
<canvas id="stage" aria-label="IJsbaan-klok: sleep de grote wijzer"></canvas>

<div class="hud">
  <div class="left"><span class="score" id="score">0</span><span class="combo" id="combo"></span></div>
  <div class="dots" id="dots" aria-label="Poorten"></div>
  <div class="right"><span class="level" id="level"></span>
    <button class="chip" id="t-sound" type="button" aria-pressed="true">Geluid</button>
    <button class="chip" id="t-calm" type="button" aria-pressed="false">Rustig</button></div>
</div>

<div class="target" id="target"></div>
<div class="live" id="live"></div>
<div class="panel" id="panel" hidden aria-live="polite"></div>

<div class="overlay" id="start">
  <div class="card">
    <h1 class="title">IJsbaan-klok</h1>
    <p>Pak de grote wijzer en schaats naar de goede tijd. Bij een bevroren poort schrijf je de tijd op; spelling maakt niet uit.</p>
    <div class="levels" id="levels"></div>
    <button class="btn primary" id="go" type="button">Schaatsen!</button>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card">
    <h1 class="title">Klaar!</h1>
    <div class="stars" id="stars"></div>
    <div class="stats" id="stats"></div>
    <p id="unlock"></p>
    <div class="levels" id="levels-end"></div>
    <button class="btn primary" id="again" type="button">Nog een rondje</button>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);

/* ---------- spel ---------- */
const LEVELS = [
  {name: 'Hele uren', minutes: [0]},
  {name: 'Half', minutes: [0, 30]},
  {name: 'Kwartier', minutes: [0, 15, 30, 45]},
  {name: 'Rond de half', minutes: Array.from({length: 12}, (_, i) => i * 5)},
  {name: 'Digitaal', minutes: Array.from({length: 60}, (_, i) => i), digital: true},
];
const GATES = 10, BUILD = new Set([2, 7]), FROZEN = new Set([4, 9]), START = 18 * 60, HOLD = 350, FAST = 9000;

const store = {
  get(k, d) { try { const v = localStorage.getItem('ijsbaan.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ijsbaan.' + k, JSON.stringify(v)); } catch (e) { /* alleen gemak */ } },
};
const S = {
  phase: 'start', level: Math.min(store.get('level', 0), LEVELS.length - 1), unlocked: Math.min(store.get('unlocked', 0), LEVELS.length - 1),
  T: START, P: START, disp: START, target: START, gate: 0, score: 0, combo: 0, best: 0, firstTry: 0,
  gateStart: 0, holdSince: 0, attempts: 0, sound: store.get('sound', true),
  calm: store.get('calm', matchMedia('(prefers-reduced-motion: reduce)').matches),
};
let PHRASES = [];

const mod = (a, n) => ((a % n) + n) % n;
const face = t => mod(t, 720);
const hhmm = t => `${String(Math.floor(mod(t, 1440) / 60)).padStart(2, '0')}:${String(mod(t, 60)).padStart(2, '0')}`;
const esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const blocks = (words, cls = '') => `<div class="blocks ${cls}">${words.map(([w, r], i) => `<span class="word ${r}" style="--i:${i}">${esc(w)}</span>`).join('')}</div>`;

/* ---------- canvas en maatvoering ---------- */
const cv = $('#stage'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, R = 100, CX = 0, CY = 0, RB = 100;
const G = {R: 100, cx: 0, cy: 0};
let rinkC, scratchC, skyC, frostC;

function off(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR); const x = c.getContext('2d'); x.setTransform(DPR, 0, 0, DPR, 0, 0); return c; }
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) { this.rect(x, y, w, h); };
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  RB = Math.max(80, Math.min(W * 0.44, (H - 250) / 2));
  rinkC = renderRink(RB);
  const old = scratchC; scratchC = off(2 * RB + 40, 2 * RB + 40);
  if (old) scratchC.getContext('2d').drawImage(old, 0, 0, 2 * RB + 40, 2 * RB + 40);
  skyC = renderSkyline();
  frostC = null;
  geometry(true);
}

function geometry(snap) {
  const top = $('#target').getBoundingClientRect().bottom + 14;
  const panel = $('#panel');
  const bottom = (panel.hidden ? $('#live') : panel).getBoundingClientRect().top - 14;
  const r = Math.max(70, Math.min(W * 0.44, (bottom - top) / 2, RB));
  const k = snap ? 1 : 0.14;
  G.R += (r - G.R) * k; G.cx += (W / 2 - G.cx) * k; G.cy += ((top + bottom) / 2 - G.cy) * k;
  R = G.R; CX = G.cx; CY = G.cy;
}

const at = (a, r) => [CX + r * Math.sin(a), CY - r * Math.cos(a)];

function renderRink(rb) {
  const s = rb + 20, c = off(2 * s, 2 * s), x = c.getContext('2d');
  x.translate(s, s);
  const ice = x.createRadialGradient(-rb * .25, -rb * .35, rb * .05, 0, 0, rb);
  ice.addColorStop(0, '#3B2C8E'); ice.addColorStop(1, '#1D0E4A');
  x.fillStyle = ice; x.beginPath(); x.arc(0, 0, rb, 0, Math.PI * 2); x.fill();
  x.save(); x.beginPath(); x.arc(0, 0, rb, 0, Math.PI * 2); x.clip();
  x.fillStyle = 'rgba(62,232,255,.10)'; x.fillRect(-rb, -rb, 2 * rb, rb);
  x.fillStyle = 'rgba(255,79,179,.14)'; x.fillRect(-rb, 0, 2 * rb, rb);
  x.strokeStyle = 'rgba(255,255,255,.05)'; x.lineWidth = rb * .08;
  for (let i = -3; i <= 3; i++) { x.beginPath(); x.moveTo(-rb, i * rb * .34 - rb * .5); x.lineTo(rb, i * rb * .34 + rb * .3); x.stroke(); }
  x.restore();
  x.setLineDash([5, 8]); x.lineWidth = 2;
  x.strokeStyle = 'rgba(255,79,179,.6)'; x.beginPath(); x.moveTo(0, 0); x.lineTo(0, rb * .97); x.stroke();
  x.strokeStyle = 'rgba(62,232,255,.4)'; x.beginPath(); x.moveTo(0, 0); x.lineTo(0, -rb * .97); x.stroke();
  x.setLineDash([]);
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * Math.PI * 2, big = i % 5 === 0, r0 = rb * (big ? .87 : .92);
    x.strokeStyle = big ? 'rgba(255,255,255,.9)' : 'rgba(205,187,255,.45)'; x.lineWidth = big ? 3 : 1.4;
    x.beginPath(); x.moveTo(r0 * Math.sin(a), -r0 * Math.cos(a)); x.lineTo(rb * .97 * Math.sin(a), -rb * .97 * Math.cos(a)); x.stroke();
  }
  x.fillStyle = '#fff'; x.font = `700 ${Math.round(rb * .14)}px Syne, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
  for (let i = 1; i <= 12; i++) { const a = i / 12 * Math.PI * 2; x.fillText(i, rb * .74 * Math.sin(a), -rb * .74 * Math.cos(a)); }
  x.font = `700 ${Math.round(rb * .06)}px Syne, sans-serif`;
  x.fillStyle = 'rgba(62,232,255,.85)'; x.fillText('H E L E   U U R', 0, -rb * .47);
  x.fillStyle = 'rgba(255,79,179,.9)'; x.fillText('H A L F', 0, rb * .47);
  return c;
}

function renderSkyline() {
  const h = Math.max(70, Math.min(H * .2, 170)), c = off(W, h), x = c.getContext('2d');
  const m = document.createElement('canvas'); m.width = W; m.height = Math.ceil(h); const mx = m.getContext('2d'); mx.fillStyle = '#fff';
  const rect = (a, b, top) => mx.fillRect(a * W, top * h, (b - a) * W, h);
  const tri = (cxf, wf, base, top) => { mx.beginPath(); mx.moveTo((cxf - wf / 2) * W, base * h); mx.lineTo((cxf + wf / 2) * W, base * h); mx.lineTo(cxf * W, top * h); mx.fill(); };
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let xf = 0; xf < 1; ) { const w = .03 + rnd() * .03, t = .62 + rnd() * .16; rect(xf, xf + w - .004, t); tri(xf + w / 2 - .002, w - .004, t, t - .1); xf += w; }
  rect(.06, .27, .55); tri(.165, .21, .55, .4); rect(.145, .178, .2); tri(.1615, .036, .2, 0);
  rect(.43, .456, .3); tri(.443, .03, .3, .18);
  rect(.6, .622, .36); tri(.611, .028, .36, .22); rect(.645, .667, .36); tri(.656, .028, .36, .22); rect(.62, .647, .48);
  rect(.78, .9, .55); tri(.84, .13, .55, .42); rect(.83, .852, .28); tri(.841, .03, .28, .08);
  const data = mx.getImageData(0, 0, W, m.height).data, step = 7;
  for (let y = 3; y < m.height; y += step) {
    let run = -1;
    for (let px = 0; px <= W; px++) {
      const on = px < W && data[(y * W + px) * 4 + 3] > 128;
      if (on && run < 0) run = px;
      if (!on && run >= 0) {
        const t = (run + px) / 2 / W;
        x.fillStyle = `rgb(${255 + (62 - 255) * t | 0},${79 + (232 - 79) * t | 0},${179 + (255 - 179) * t | 0})`;
        x.beginPath(); x.roundRect(run, y - 2, Math.max(4, px - run), 4, 2); x.fill(); run = -1;
      }
    }
  }
  return c;
}

/* ---------- deeltjes en juice ---------- */
let parts = [], texts = [], rings = [], snow = [], shake = 0, stopUntil = 0, frost = {a: 0, goal: 0, cracks: []};
const COL = ['#FF4FB3', '#3EE8FF', '#FFD34E', '#FFFFFF', '#B48CFF'];
const juice = n => S.calm ? Math.ceil(n * .3) : n;

function burst(x, y, n, speed = 7, kind = 'confetti') {
  for (let i = 0; i < juice(n); i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (.4 + Math.random());
    parts.push({kind, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 1, decay: .012 + Math.random() * .012,
      size: 4 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, color: COL[i % COL.length]});
  }
}
function spray(x, y, dirX, dirY, n) {
  for (let i = 0; i < juice(n); i++) {
    parts.push({kind: 'spray', x, y, vx: -dirX * (2 + Math.random() * 3) + (Math.random() - .5) * 2, vy: -dirY * (2 + Math.random() * 3) + (Math.random() - .5) * 2,
      life: 1, decay: .04 + Math.random() * .03, size: 1.5 + Math.random() * 2.5, color: Math.random() < .7 ? '#FFFFFF' : '#9FF3FF'});
  }
}
function cannons(n) {
  for (const side of [0, 1]) for (let i = 0; i < juice(n); i++) {
    const a = side ? -Math.PI * (.62 + Math.random() * .16) : -Math.PI * (.22 + Math.random() * .16), v = 12 + Math.random() * 10;
    parts.push({kind: 'confetti', x: side ? W : 0, y: H, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: .005 + Math.random() * .006,
      size: 5 + Math.random() * 7, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, color: COL[i % COL.length]});
  }
}

/* ---------- ronde ---------- */

  for (let d = 10; d <= 90; d++) if (L.minutes.includes(mod(S.T + d, 60))) options.push(S.T + d);
  S.target = options[Math.floor(Math.random() * options.length)];
}

function startRun() {
  Object.assign(S, {phase: 'skate', T: START, P: START, disp: START, gate: 0, score: 0, combo: 0, best: 0, firstTry: 0});
  scratchC.getContext('2d').clearRect(0, 0, 2 * RB + 40, 2 * RB + 40);
  $('#start').hidden = true; $('#end').hidden = true;

}

function nextGate() {

  if (BUILD.has(S.gate)) return startBuild();
  if (FROZEN.has(S.gate)) return startFrozen();
  S.phase = 'skate'; pickTarget(); S.gateStart = performance.now(); S.holdSince = 0;
  renderTarget();

  burst(x, y, 60); rings.push({x, y, r: 10, life: 1}); floatText(x, y - 40, `+${pts}`);
  kick(12, 90); SFX.gate(S.combo); popCombo();

  }
  $('#stars').innerHTML = [0, 1, 2].map(i => `<span class="${i < stars ? 'on' : ''}">★</span>`).join('');
  $('#stats').innerHTML = `<div><b>${S.score}</b><span>punten</span></div><div><b>×${Math.min(S.best, 5)}</b><span>beste reeks</span></div><div><b>${S.firstTry}/${special}</b><span>bouw- en ijspoorten in één keer</span></div>`;
  $('#unlock').textContent = unlocked || (stars === 3 ? 'Drie sterren!' : 'Haal alle bouw- en ijspoorten in één keer voor drie sterren.');
  renderLevels('#levels-end');
  $('#target').innerHTML = '';
  $('#end').hidden = false; SFX.fanfare(); cannons(40 + stars * 30);
}

function renderLevels(sel) {
  $(sel).innerHTML = LEVELS.map((l, i) => `<button class="lv" type="button" data-level="${i}" aria-pressed="${i === S.level}" ${i > S.unlocked ? 'disabled' : ''}><b>${i + 1}</b>${l.name}</button>`).join('');
  $(sel).querySelectorAll('.lv').forEach(b => b.addEventListener('click', () => {
    S.level = +b.dataset.level; store.set('level', S.level); renderLevels(sel); renderHud();
  }));
}

/* ---------- bevroren poort: het taalmodel leest mee ---------- */
const panel = $('#panel');
async function api(path, body) {
  const r = await fetch(path, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error(`${path} gaf ${r.status}: ${await r.text()}`);
  return r.json();
}
function show(html, who = '<span>Schaatsleraar</span><span>Apple-model op deze Mac</span>') { panel.hidden = false; panel.innerHTML = `<div class="who">${who}</div>${html}`; }
function thinking(text) { show(`<div class="thinking"><i></i><i></i><i></i>${text}</div>`); }
function failed(err, retry) {
  show(`<p class="ask">Er ging iets mis met de leraar.</p><p class="sub">${esc(String(err.message || err))}</p><div class="choices"><button class="btn primary" type="button" id="retry">Opnieuw</button></div>`);
  $('#retry').addEventListener('click', retry);
}
const clock = () => ({hour: Math.floor(mod(S.target, 1440) / 60), minute: mod(S.target, 60)});

function spinTo(then) {
  S.phase = 'spin'; pickTarget(); renderTarget(); renderLive();
  const from = S.T, to = S.target, t0 = performance.now(), dur = S.calm ? 10 : 1100;
  const spin = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    S.T = Math.round(from + (to - from) * e); S.P = S.T;
    if (p < 1) return requestAnimationFrame(spin);
    S.T = S.P = to; then();
  };
  requestAnimationFrame(spin);
}

function startFrozen() {
  S.attempts = 0; frost.cracks = []; frostC = null;
  spinTo(() => { S.phase = 'frozen'; frost.goal = 1; SFX.freeze(); kick(6, 0); write(); });
}

function write(note = '', example = null) {
  show(`<p class="ask">${note || 'Hoe laat is het? Schrijf het op.'}</p>${example ? `${blocks(example, 'enter')}<p class="sub">Schrijf het nu zelf.</p>` : '<p class="sub">Spelling maakt niet uit.</p>'}
    <form id="form"><input id="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Jouw antwoord" placeholder="schrijf hier…">
    <button class="btn primary" type="submit">Ontdooi!</button></form>`);
  const input = $('#answer'); setTimeout(() => input.focus(), 50);
  $('#form').addEventListener('submit', e => { e.preventDefault(); if (input.value.trim()) read(input.value.trim()); });
}

async function read(text) {
  thinking('Het ijs leest mee…');
  let res;
  try { res = await api('/read', {...clock(), text}); } catch (err) { return failed(err, () => read(text)); }
  S.attempts++;
  if (res.verdict === 'unreadable') return S.attempts >= 2 ? together(res.right) : write(`Ik kan „${esc(res.spelled)}” niet goed lezen. Probeer het nog eens?`);
  if (res.verdict === 'right' || res.verdict === 'other_words') {
    const first = S.attempts === 1;
    show(res.verdict === 'right'
      ? `<p class="ask">Ik lees:</p>${blocks(res.said, 'enter')}<p class="ask">Helemaal goed!</p>`
      : `<p class="ask">Dat klopt! Meestal zeggen we:</p>${blocks(res.right, 'enter')}`);
    return thaw(first ? 300 : 150, first);
  }
  show(`<p class="ask">Ik lees:</p>${blocks(res.said, 'enter')}<p class="ask">Bedoel je dat?</p>
    <div class="choices"><button class="btn primary" type="button" id="yes">Ja</button><button class="btn ghost" type="button" id="no">Nee, opnieuw</button></div>`);
  $('#yes').addEventListener('click', () => S.attempts >= 2 ? together(res.right) : ask(res.dialogue));
  $('#no').addEventListener('click', () => S.attempts >= 2 ? together(res.right) : write('Schrijf het nog een keer, dan lees ik beter.'));
  SFX.soft();
}

async function ask(dialogue) {
  thinking('De leraar denkt na…');
  let q;
  try { q = await api('/ask', dialogue); } catch (err) { return failed(err, () => ask(dialogue)); }
  question(q);
}

function question(q) {
  const bar = Array.from({length: q.total}, (_, i) => `<b class="${i < q.number ? 'on' : ''}"></b>`).join('');
  show(`<div class="steps">${bar}</div>${q.lead ? `<p class="sub" style="margin-top:14px">${esc(q.lead)}</p>` : ''}<p class="ask" style="margin-top:14px">${esc(q.question)}</p>
    <div class="choices">${q.options.map(o => `<button class="btn" type="button">${esc(o)}</button>`).join('')}</div><p class="hint" id="hint"></p>`);
  panel.querySelectorAll('.choices .btn').forEach(b => b.addEventListener('click', () => choose(q, b.textContent)));
}

async function choose(q, choice) {
  let res;
  try { res = await api('/step', {dialogue: q.dialogue, choice}); } catch (err) { return failed(err, () => choose(q, choice)); }
  if (!res.correct) {
    $('#hint').textContent = res.hint; SFX.soft();
    panel.classList.remove('wobble'); void panel.offsetWidth; panel.classList.add('wobble');
    return;
  }
  crack(); SFX.crack(); kick(5, 40);
  if (res.done) return write('Goed zo! Zo zeg je het:', res.right);
  question(res);
}

function together(right) {
  show(`<p class="ask">We doen hem samen. Het is:</p>${blocks(right, 'enter')}<div class="choices"><button class="btn primary" type="button" id="thaw">Ontdooi samen</button></div>`);
  $('#thaw').addEventListener('click', () => thaw(50, false));
}

function thaw(points, first) {
  S.phase = 'between';
  if (first) { S.firstTry++; S.combo++; S.best = Math.max(S.best, S.combo); popCombo(); }
  const pts = points * Math.max(1, Math.min(S.combo, 5));
  setTimeout(() => {
    shatter(); SFX.shatter(); floatText(CX, CY - R * .3, `+${pts}`, '#DFF7FF');
    S.score += pts; S.gate++; panel.hidden = true;
    setTimeout(nextGate, S.calm ? 200 : 900);
  }, 900);
}

/* ---------- zinnen bouwen: woordblokjes, de regels komen van de server ---------- */
function startBuild() { spinTo(() => { S.phase = 'build'; S.placed = []; S.misses = 0; build(); }); }

async function build() {
  let res;
  try { res = await api('/build', clock()); } catch (err) { return failed(err, build); }
  show(`<p class="ask">Bouw de zin. Tik de woorden in de goede volgorde.</p><div class="built" id="built"><span class="slot"></span></div>
    <div class="tray">${res.tray.map(w => `<button class="word" type="button">${esc(w)}</button>`).join('')}</div><p class="hint" id="hint"></p>`, '<span>Zinnen bouwen</span>');
  panel.querySelectorAll('.tray .word').forEach(b => b.addEventListener('click', () => tap(b)));
}

async function tap(block) {
  const word = block.textContent;
  let res;
  try { res = await api('/place', {...clock(), placed: S.placed, word}); } catch (err) { return failed(err, () => tap(block)); }
  if (res.hint) {
    S.misses++; $('#hint').textContent = res.hint; SFX.soft();
    block.classList.remove('nope'); void block.offsetWidth; block.classList.add('nope');
    return;
  }
  S.placed.push(word); block.remove(); $('#hint').textContent = '';
  $('#built .slot').insertAdjacentHTML('beforebegin', `<span class="word ${res.role} pop">${esc(word)}</span>`);
  SFX.lock(S.placed.length * 2);
  if (!res.done) return;
  $('#built .slot').remove();
  panel.querySelectorAll('.tray .word').forEach(b => { b.disabled = true; });
  thaw(S.misses ? 50 : 100, !S.misses);
}

/* ---------- start ---------- */
function toggles() {
  const sound = $('#t-sound'), calm = $('#t-calm');
  sound.setAttribute('aria-pressed', S.sound); calm.setAttribute('aria-pressed', S.calm);
  document.body.classList.toggle('calm', S.calm);
  if (A.ctx) A.master.gain.value = S.sound ? .8 : 0;
}
$('#t-sound').addEventListener('click', () => { audio(); S.sound = !S.sound; store.set('sound', S.sound); toggles(); });
$('#t-calm').addEventListener('click', () => { S.calm = !S.calm; store.set('calm', S.calm); toggles(); });
$('#go').addEventListener('click', () => { audio(); startRun(); });
$('#again').addEventListener('click', () => { audio(); startRun(); });
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (A.ctx) document.hidden ? A.ctx.suspend() : A.ctx.resume(); });

(async function boot() {
  snow = Array.from({length: 60}, () => ({x: Math.random() * innerWidth, y: Math.random() * innerHeight, v: .3 + Math.random() * .7, s: .8 + Math.random() * 1.8, o: .2 + Math.random() * .5, p: Math.random() * 6}));
  await document.fonts.load('40px Monoton').catch(() => null);
  await document.fonts.load('700 20px Syne').catch(() => null);
  PHRASES = await (await fetch('/phrases')).json();
  toggles(); renderLevels('#levels'); renderHud(); resize();
  requestAnimationFrame(frame);
})();
</script>
</body>

/* ---------- voor ouders: één ding om op te letten, met een eigen voorbeeld en iets voor thuis; alles in deze browser ---------- */
const SLIPS = {
  hour: {why: 'Bij „voor” en „half” hoort het uur dat nog komt.', home: 'Vraag bij een klok eerst: „Welk uur komt eraan?”'},
  order: {why: 'Eerst de minuten, dan het uur.', home: 'Zeg samen tijden hardop. Het uur komt als laatste.'},
  direction: {why: '„Over” is al voorbij, „voor” komt nog.', home: 'Volg de grote wijzer met je vinger: is de 12 of de 6 al geweest?'},
  anchor: {why: 'Grote wijzer onder: het gaat om half. Boven: om het hele uur.', home: 'Vraag alleen: staat de grote wijzer boven of onder?'},
  number: {why: 'Minuten tel je in stapjes van vijf.', home: 'Tel samen langs de getallen: vijf, tien, kwart, twintig.'},
  '24h': {why: 'Na 12 uur tel je door: 13 is 1, 14 is 2.', home: 'Wijs een digitale klok aan, zoals op de oven: waar staat de kleine wijzer dan?'},
};
const WEEK = 7 * 24 * 3600 * 1000;
const said = t => PHRASES[face(t)].map(([w]) => w).join(' ');
const shown = t => LEVELS[S.level].digital ? hhmm(t) : said(t);

function slip(mistake, how, what) { S.slips.push(mistake); S.example = S.example || {mistake, how, what}; }

function logGate(kind, first) {
  if (S.together) S.helped = true;
  if (kind !== 'skate') S.marks.push({kind, first, together: S.together});
  const log = store.get('log', []);
  log.push({at: Date.now(), level: S.level, kind, first, together: S.together, slips: S.slips, target: shown(S.target), right: said(S.target), example: S.example});
  store.set('log', log.slice(-3000));
}

const lastWeek = () => store.get('log', []).filter(g => Date.now() - g.at < WEEK);
const tally = (gates, mistake) => gates.reduce((n, g) => n + g.slips.filter(s => s === mistake).length, 0);

/* de denkfout die deze week het vaakst voorkwam, vanaf drie keer: het spel geeft daar vaker tijden voor */
function focus() {
  const week = lastWeek(), [top] = Object.keys(SLIPS).map(m => [m, tally(week, m)]).sort((a, b) => b[1] - a[1]);
  return top[1] >= 3 ? top[0] : null;
}

function trains(t, mistake) {
  const words = PHRASES[face(t)].map(([w]) => w);
  if (mistake === 'hour') return words.includes('half') || words.includes('voor');
  if (mistake === '24h') return mod(t, 1440) >= 13 * 60;
  return words.includes('over') || words.includes('voor');
}

/* per niveau een woord, de fout die het vaakst voorkwam met een eigen voorbeeld, en één ding om thuis te doen */
function report() {
  const week = lastWeek(), weak = focus();
  const progress = LEVELS.map((l, i) => {
    const gates = week.filter(g => g.level === i), share = gates.filter(g => g.first).length / gates.length;
    const [cls, word] = !gates.length ? ['none', 'nog niet geoefend'] : share >= .8 ? ['ok', 'kan het'] : share >= .5 ? ['almost', 'bijna'] : ['hard', 'nog lastig'];
    return `<li><span>${l.name}</span><b class="${cls}">${word}</b></li>`;
  }).join('');
  const seen = weak && week.filter(g => g.example && g.example.mistake === weak).at(-1);
  const wrong = !weak ? '' : `<h3>Dit gaat nog vaak mis</h3>
    ${seen && seen.target !== seen.right ? `<p>Bij ${esc(seen.target)}:</p>` : ''}
    ${seen ? `<div class="said"><span class="no">✗</span><span class="no">${esc(seen.example.what)}</span><span class="yes">✓</span><span class="yes">${esc(seen.right)}</span></div>` : ''}
    <p>${SLIPS[weak].why}</p>
    <h3>Oefen thuis</h3><p>${SLIPS[weak].home}</p><p class="small">Het spel oefent dit nu ook vaker.</p>`;
  $('#parents-title').textContent = `Hoe gaat het klokkijken${store.player ? ' bij ' + store.player : ''}?`;
  $('#forget').hidden = !store.player;
  $('#report').innerHTML = `<div class="focus"><ul class="progress">${progress}</ul>${wrong}</div>`;
  $('#parents').hidden = false;
}
$('#open-parents').addEventListener('click', report);
$('#close-parents').addEventListener('click', () => { $('#parents').hidden = true; });
$('#reset').addEventListener('click', () => {
  if (!confirm(`Opnieuw beginnen${store.player ? ' voor ' + store.player : ''}? Niveaus en dit overzicht worden gewist.`)) return;
  for (const k of OWN) store.drop(k);
  location.reload();
});
$('#forget').addEventListener('click', () => {
  if (!confirm(`${store.player} weghalen? Alles van ${store.player} wordt gewist.`)) return;
  for (const k of OWN) store.drop(k);
  store.set('players', store.get('players', []).filter(p => p !== store.player)); store.set('player', '');
  location.reload();
});

/* wie speelt er: namen blijven op deze computer; de eerste naam krijgt wat er al zonder naam gespeeld was */
function renderPlayers() {
  const players = store.get('players', []);
  $('#players').innerHTML = `<span class="lbl">Wie speelt er?</span><div class="levels">${players.map(p =>
    `<button class="lv" type="button" aria-pressed="${p === store.player}">${esc(p)}</button>`).join('')}
    <form id="add-player" class="lv"><input id="name" maxlength="20" autocomplete="off" placeholder="Nieuwe naam" aria-label="Nieuwe naam"><button type="submit" aria-label="Naam toevoegen">+</button></form></div>`;
  $('#players').querySelectorAll('button.lv').forEach(b => b.addEventListener('click', () => pick(b.textContent)));
  $('#add-player').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#name').value.trim();
    if (!name || players.includes(name)) return;
    if (!players.length) for (const k of OWN) { const v = store.get(k, null); if (v !== null) { store.drop(k); store.player = name; store.set(k, v); store.player = ''; } }
    store.set('players', [...players, name]); pick(name);
  });
}

function pick(name) {
  store.player = name; store.set('player', name);
  S.level = Math.min(store.get('level', 0), LEVELS.length - 1); S.unlocked = Math.min(store.get('unlocked', 0), LEVELS.length - 1);
  renderPlayers(); renderLevels('#levels'); renderHud();
}
$('#reload').addEventListener('click', () => location.reload());
$('#live').addEventListener('click', e => { if (e.target.closest('#samen')) { audio(); startTogether(performance.now()); } });

/* ---------- start ---------- */
function toggles() {
  const sound = $('#t-sound'), calm = $('#t-calm');
  sound.setAttribute('aria-pressed', S.sound); calm.setAttribute('aria-pressed', S.calm);
  document.body.classList.toggle('calm', S.calm);
  if (A.ctx) A.master.gain.value = S.sound ? .8 : 0;
}
$('#t-sound').addEventListener('click', () => { audio(); S.sound = !S.sound; store.set('sound', S.sound); toggles(); });
$('#t-calm').addEventListener('click', () => { S.calm = !S.calm; store.set('calm', S.calm); toggles(); });
$('#go').addEventListener('click', () => { audio(); startRun(); });
$('#t-menu').addEventListener('click', stopRun);
$('#again').addEventListener('click', () => { audio(); startRun(); });
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (A.ctx && document.hidden) A.ctx.suspend().catch(mute); });
function mute(err) { console.warn('Geen geluid:', err); }

(async function boot() {
  snow = Array.from({length: 60}, () => ({x: Math.random() * innerWidth, y: Math.random() * innerHeight, v: .3 + Math.random() * .7, s: .8 + Math.random() * 1.8, o: .2 + Math.random() * .5, p: Math.random() * 6}));
  await document.fonts.load('40px Monoton').catch(() => null);
  await document.fonts.load('700 20px Syne').catch(() => null);
  $('#go').disabled = true; $('#go').textContent = 'Laden…';
  if (ENGINE === 'browser') await engine();
  PHRASES = await api('/phrases', {});
  $('#go').disabled = false; $('#go').textContent = 'Schaatsen!';
  toggles(); renderPlayers(); renderLevels('#levels'); renderHud(); resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

[project]
name = "klokkijken"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apple-fm-sdk",
    "fm-pydantic-ai",
    "pydantic-ai-slim>=2.59.0",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "playwright>=1.64.1",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.sources]
apple-fm-sdk = { git = "https://github.com/mattijn/fm-pydantic-ai", rev = "39b0586", subdirectory = "vendor/apple_fm_sdk-0.2.1" }
fm-pydantic-ai = { git = "https://github.com/mattijn/fm-pydantic-ai", rev = "39b0586" }

[tool.ruff]
line-length = 120

[tool.mypy]
files = ["klok.py", "tutor.py", "server.py", "tests", "evals"]
strict = true

[[tool.mypy.overrides]]
module = ["apple_fm_sdk.*", "apple_fm_model"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
